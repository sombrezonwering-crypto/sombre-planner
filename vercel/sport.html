<style>
/* Credit line — bottom-right */
.design-ui-credit {
  position: fixed;
  bottom: 12px;
  right: 12px;
  font: 11px/1 system-ui, sans-serif;
  color: rgba(128,128,128,0.5);
  pointer-events: none;
  z-index: 2147483647;
  transition: opacity 0.4s ease;
  user-select: none;
  letter-spacing: 0.02em;
}

/* Hide chrome on touch devices */
@media (hover: none) {
  .design-ui-credit { display: none; }
}

/* Print fixes */
@media print {
  * {
    transition: none !important;
    animation: none !important;
    box-shadow: none !important;
  }
  body {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
  .design-ui-credit { display: none !important; }
}

</style>
<script>
(function () {
    // Design-ui pages are single compositions, so the whole body is editable.
    function markEditable() {
        document.body.classList.add('artifact-editable');
    }

    // Credit badge with idle-fade. Hover devices only.
    function initChromeUI() {
        if (!matchMedia('(hover: hover)').matches) return;

        var credit = document.createElement('div');
        credit.className = 'design-ui-credit';
        credit.setAttribute('aria-hidden', 'true');
        credit.innerHTML = '\u{1F49C} by ClickUp Brain';
        document.body.appendChild(credit);

        var timer = null;
        var fade = function (out) { credit.style.opacity = out ? '0' : ''; };
        fade(true);
        var show = function () {
            fade(false);
            clearTimeout(timer);
            timer = setTimeout(function () { fade(true); }, 3000);
        };
        document.addEventListener('mousemove', show);
        show();
    }

    function init() {
        markEditable();
        initChromeUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

</script>

// Storage
function getHistory(ex){let d=localStorage.getItem('zap25_'+ex);return d?JSON.parse(d):null;}
function saveHistory(ex,w,r){localStorage.setItem('zap25_'+ex,JSON.stringify({w,r}));saveProgressEntry(ex,w,r);}
function getProgressHistory(){let d=localStorage.getItem('zap25_progress');return d?JSON.parse(d):{};}
function saveProgressEntry(ex,w,r){let h=getProgressHistory();if(!h[ex])h[ex]=[];const today=new Date().toISOString().split('T')[0];let te=h[ex].find(e=>e.date===today);if(te){if(w>te.w||(w===te.w&&r>te.r)){te.w=w;te.r=r;}}else{h[ex].push({date:today,w,r});}h[ex]=h[ex].filter(e=>(new Date()-new Date(e.date))/(1000*60*60*24)<=60);localStorage.setItem('zap25_progress',JSON.stringify(h));}
function getWeekDates(wa){const n=new Date();const dow=n.getDay()===0?7:n.getDay();const mon=new Date(n);mon.setDate(n.getDate()-(dow-1)-(wa*7));mon.setHours(0,0,0,0);const sun=new Date(mon);sun.setDate(mon.getDate()+6);sun.setHours(23,59,59,999);return{start:mon,end:sun};}
function getEntriesForWeek(entries,wa){const{start,end}=getWeekDates(wa);return entries.filter(e=>{const d=new Date(e.date);return d>=start&&d<=end;});}

// Progress Tracker
function renderProgress(fg){
const h=getProgressHistory();const allEx=Object.keys(h).filter(ex=>{if(!fg||fg==='ALLES')return true;return exercises[ex]&&exercises[ex].groep===fg.toLowerCase();});
let tg=0,tv=0,sw=new Set();const{start:ws,end:we}=getWeekDates(0);
Object.entries(h).forEach(([ex,entries])=>{entries.forEach(e=>{const d=new Date(e.date);if(d>=ws&&d<=we){sw.add(e.date);tv+=(e.w*e.r*3);}});});
allEx.forEach(ex=>{const entries=h[ex];const tw=getEntriesForWeek(entries,0);const lw=getEntriesForWeek(entries,1);if(tw.length>0&&lw.length>0){const bt=tw.reduce((a,b)=>a.w>b.w?a:b);const bl=lw.reduce((a,b)=>a.w>b.w?a:b);if(bt.w>bl.w||(bt.w===bl.w&&bt.r>bl.r))tg++;}});
document.getElementById('sum-sessions').innerText=sw.size;document.getElementById('sum-gains').innerText=tg;document.getElementById('sum-volume').innerText=tv>999?Math.round(tv/1000)+'k':tv;
const listEl=document.getElementById('progress-list');
if(allEx.length===0){listEl.innerHTML='<div class="progress-empty">Nog geen data. Train een sessie!</div>';return;}
let html='';allEx.sort().forEach(ex=>{const entries=h[ex];const tw=getEntriesForWeek(entries,0);const lw=getEntriesForWeek(entries,1);let badge='',cur='';
if(tw.length>0){const bt=tw.reduce((a,b)=>a.w>b.w?a:b);cur=`<span class="progress-current">${bt.w}kg &times; ${bt.r}</span>`;if(lw.length>0){const bl=lw.reduce((a,b)=>a.w>b.w?a:b);const wd=bt.w-bl.w;const rd=bt.r-bl.r;if(wd>0)badge=`<span class="progress-badge badge-gain">+${wd}kg</span>`;else if(wd<0)badge=`<span class="progress-badge badge-loss">${wd}kg</span>`;else if(rd>0)badge=`<span class="progress-badge badge-gain">+${rd}r</span>`;else if(rd<0)badge=`<span class="progress-badge badge-loss">${rd}r</span>`;else badge=`<span class="progress-badge badge-same">=</span>`;}else badge=`<span class="progress-badge badge-gain">NIEUW</span>`;}
else if(lw.length>0){const bl=lw.reduce((a,b)=>a.w>b.w?a:b);cur=`<span class="progress-current">${bl.w}kg &times; ${bl.r}</span>`;badge=`<span class="progress-badge badge-same">VORIG</span>`;}
html+=`<div class="progress-row"><div class="progress-ex-name">${ex}</div><div class="progress-stats">${cur} ${badge}</div></div>`;});
listEl.innerHTML=html;
}

const m=Math.floor(timeLeft/60),s=timeLeft%60;
document.getElementById('timer').innerText=`${m}:${s<10?'0':''}${s}`;
if(mode==='REST'||mode==='TRANS'||mode==='CORE'){
localTimeRemaining--;
if(mode==='REST'||mode==='TRANS'){document.getElementById('rest-display').innerText=localTimeRemaining;if(localTimeRemaining<=3&&localTimeRemaining>0)speak(String(localTimeRemaining));if(localTimeRemaining<=0)autoNextPhase();}
else if(mode==='CORE'){document.getElementById('core-display').innerText=localTimeRemaining;if(localTimeRemaining<=3&&localTimeRemaining>0)speak(String(localTimeRemaining));if(localTimeRemaining<=0)nextCoreStep();}
}
if(timeLeft<=0)finishSession(false);
},1000);
}

function loadMainExercise(index){
mode='WORK';const ex=mainExercises[index];
document.getElementById('ex-title').innerText=`${index+1}/3: ${ex}`;
document.getElementById('ex-eq').innerText=`[ ${exercises[ex].eq.toUpperCase()} ]`;
document.getElementById('instruction').innerText=exercises[ex].d;
showSvg(ex);document.getElementById('visual-card').classList.remove('transitioning');
let hist=getHistory(ex);weight=hist?hist.w:10;reps=hist?hist.r:12;adj('w',0);adj('r',0);
currentSet=1;document.getElementById('logBtn').innerText=`LOG SET ${currentSet}`;
speak(`Missie: ${ex}. Drie sets. Ga!`);
}

function logSet(){
if(mode!=='WORK')return;
saveHistory(mainExercises[currentMainIndex],weight,reps);
if(currentSet<3){startSubTimer(30,'REST',"RUST");}
else{currentMainIndex++;
if(currentMainIndex<mainExercises.length){startSubTimer(20,'TRANS',"WISSEL");speak(getRandomQuote(quotesTrans)+" Volgende: "+mainExercises[currentMainIndex]);}
else{showCoreChoice();}
}}

function startSubTimer(sec,timerMode,label){
mode=timerMode;localTimeRemaining=sec;currentSet++;
document.getElementById('workout-controls').classList.add('hidden');
document.getElementById('db-panel').classList.add('resting');
document.getElementById('rest-container').classList.remove('hidden');
document.getElementById('rest-label').innerText=label;
document.getElementById('rest-display').innerText=localTimeRemaining;
if(timerMode==='TRANS'){
document.getElementById('visual-card').classList.add('transitioning');
if(currentMainIndex<mainExercises.length){const nx=mainExercises[currentMainIndex];document.getElementById('ex-title').innerText=`VOLGENDE: ${nx}`;document.getElementById('ex-eq').innerText=`[ ${exercises[nx].eq.toUpperCase()} ]`;document.getElementById('instruction').innerText=exercises[nx].d;showSvg(nx);}
}
if(timerMode==='REST')speak("30 seconden rust.");
}

function skipTimer(){if(mode==='REST'||mode==='TRANS'){localTimeRemaining=0;autoNextPhase();}}
function autoNextPhase(){
document.getElementById('rest-container').classList.add('hidden');document.getElementById('db-panel').classList.remove('resting');
if(currentMainIndex<mainExercises.length){if(mode==='REST'){mode='WORK';document.getElementById('workout-controls').classList.remove('hidden');document.getElementById('logBtn').innerText=`LOG SET ${currentSet}`;speak("GO!");}else if(mode==='TRANS'){loadMainExercise(currentMainIndex);document.getElementById('workout-controls').classList.remove('hidden');}}
else{showCoreChoice();}
}

// === CORE CHOICE ===
function showCoreChoice(){
document.getElementById('workout-controls').classList.add('hidden');
document.getElementById('visual-card').style.display='none';
document.getElementById('core-choice').classList.remove('hidden');
speak("Hoofdblok klaar! Kies: buikspieren of planken?");
}

// Core circuit (Crunches, Bicycle Crunches, Leg Raises, Mountain Climbers - pick 3)
function startCoreCircuit(){
document.getElementById('core-choice').classList.add('hidden');
document.getElementById('visual-card').style.display='flex';
document.getElementById('db-panel').classList.add('core-mode');
document.getElementById('core-container').classList.remove('hidden');
const coreExs=["Crunches","Bicycle Crunches","Leg Raises","Mountain Climbers"];
coreCircuitQueue=[];
coreExs.forEach(ex=>{coreCircuitQueue.push({t:'work',ex,time:40});coreCircuitQueue.push({t:'trans',ex:'Wissel',time:15});});
coreExs.forEach(ex=>{coreCircuitQueue.push({t:'work',ex,time:40});coreCircuitQueue.push({t:'trans',ex:'Wissel',time:15});});
coreCircuitQueue.pop();
mode='CORE';speak("Core Circuit! Vier oefeningen, twee rondes. Geen excuses!");
nextCoreStep();
}

function nextCoreStep(){
if(coreCircuitQueue.length===0){finishSession(true);return;}
let step=coreCircuitQueue.shift();localTimeRemaining=step.time;
let nextEx=coreCircuitQueue.length>0?coreCircuitQueue[0].ex:"Finish";
if(step.t==='work'){
document.getElementById('core-label').innerText=step.ex.toUpperCase();document.getElementById('core-label').style.color="var(--core)";
document.getElementById('core-next').innerText=`Hierna: ${nextEx}`;
document.getElementById('ex-title').innerText="CORE";document.getElementById('ex-eq').innerText=`[ ${exercises[step.ex].eq.toUpperCase()} ]`;
document.getElementById('instruction').innerText=exercises[step.ex].d;showSvg(step.ex);
speak(`${step.ex}! 40 seconden!`);
}else{
document.getElementById('core-label').innerText="WISSEL";document.getElementById('core-label').style.color="var(--rest)";
document.getElementById('core-next').innerText=`Volgende: ${nextEx}`;
if(coreCircuitQueue.length>0&&coreCircuitQueue[0].t==='work'){const up=coreCircuitQueue[0].ex;document.getElementById('ex-title').innerText=`VOLGENDE: ${up}`;document.getElementById('instruction').innerText=exercises[up].d;showSvg(up);}
speak(`15 seconden wissel!`);
}
document.getElementById('core-display').innerText=localTimeRemaining;
}

// === PLANK MODE ===
function startPlankMode(){
document.getElementById('core-choice').classList.add('hidden');
document.getElementById('visual-card').style.display='flex';
document.getElementById('db-panel').classList.add('plank-mode');
document.getElementById('plank-container').classList.remove('hidden');
document.getElementById('ex-title').innerText="PLANK HOLD";
document.getElementById('ex-eq').innerText="[ LICHAAMSGEWICHT ]";
document.getElementById('instruction').innerText="Onderarmen op grond. Lichaam recht. Span alles aan. Hou vol!";
showSvg("Plank");
mode='PLANK';
speak("Plank challenge! 3 sets van 2 minuten. Start wanneer je klaar bent.");
}

function togglePlank(){
if(!plankActive){startPlankTimer();}
else{clearInterval(plankInterval);plankActive=false;document.getElementById('plankBtn').innerText="HERVAT";}
}

function startPlankTimer(){
plankActive=true;plankResting=false;
document.getElementById('plankBtn').innerText="PAUZE";
document.getElementById('plank-rest-info').classList.add('hidden');
speak(`Plank set ${plankCurrentSet}! Twee minuten!`);
plankInterval=setInterval(()=>{
if(plankResting){
plankRestTime--;document.getElementById('plank-timer-display').innerText=`0:${plankRestTime<10?'0':''}${plankRestTime}`;
if(plankRestTime<=3&&plankRestTime>0)speak(String(plankRestTime));
if(plankRestTime<=0){clearInterval(plankInterval);plankResting=false;plankRestTime=30;document.getElementById('plank-rest-info').classList.add('hidden');document.getElementById('plank-timer-display').innerText="2:00";speak(`Set ${plankCurrentSet}! Go!`);startPlankTimer();}
}else{
plankTimeLeft--;const m=Math.floor(plankTimeLeft/60),s=plankTimeLeft%60;document.getElementById('plank-timer-display').innerText=`${m}:${s<10?'0':''}${s}`;
if(plankTimeLeft<=5&&plankTimeLeft>0)speak(String(plankTimeLeft));
if(plankTimeLeft<=0){clearInterval(plankInterval);plankActive=false;speak(`Set ${plankCurrentSet} klaar!`);
if(plankCurrentSet<3){plankCurrentSet++;plankTimeLeft=120;document.getElementById('plank-set-info').innerText=`SET ${plankCurrentSet} / 3`;document.getElementById('plank-rest-info').classList.remove('hidden');document.getElementById('plank-rest-info').innerText="RUST: 30 SEC...";plankResting=true;plankRestTime=30;plankActive=true;document.getElementById('plankBtn').innerText="PAUZE";
plankInterval=setInterval(()=>{plankRestTime--;document.getElementById('plank-timer-display').innerText=`0:${plankRestTime<10?'0':''}${plankRestTime}`;if(plankRestTime<=3&&plankRestTime>0)speak(String(plankRestTime));if(plankRestTime<=0){clearInterval(plankInterval);plankResting=false;plankRestTime=30;document.getElementById('plank-rest-info').classList.add('hidden');document.getElementById('plank-timer-display').innerText="2:00";speak(`Set ${plankCurrentSet}! Go!`);startPlankTimer();}},1000);
}else{finishSession(true);}
}}
},1000);
}

function finishSession(ok){
clearInterval(globalTimerInterval);clearInterval(plankInterval);
document.getElementById('core-container').classList.add('hidden');document.getElementById('rest-container').classList.add('hidden');
document.getElementById('workout-controls').classList.add('hidden');document.getElementById('plank-container').classList.add('hidden');
if(ok){speak("Sessie voltooid! Beast mode!");document.body.style.background="var(--accent)";document.getElementById('input-ui').innerHTML="<h1 style='text-align:center;color:white;'>MISSIE VOLTOOID!</h1>";document.getElementById('visual-card').style.display='none';}
else{speak("Tijd is om!");document.body.style.background="red";document.getElementById('input-ui').innerHTML="<h1 style='text-align:center;color:white;'>TIJD IS OM</h1>";document.getElementById('visual-card').style.display='none';}
timeLeft=0;document.getElementById('timer').innerText="0:00";
}

init();
</script>
</body>
</html>
