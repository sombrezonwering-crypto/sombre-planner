<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sombre - Oplevering & Service</title>
    <style>
        /* === BASIS LAYOUT === */
        html, body { height: 100%; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f2f2f7; color: #1c1c1e; }
        #app-container { display: flex; flex-direction: column; min-height: 100dvh; padding: 15px; box-sizing: border-box; max-width: 600px; margin: 0 auto; }

        .card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #d1d1d6; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; color: #005a9c; border-bottom: 2px solid #005a9c; padding-bottom: 8px; }

        /* FORM ELEMENTEN */
        label { display: block; font-size: 12px; font-weight: 700; color: #555; margin-bottom: 5px; text-transform: uppercase; }
        input, select, textarea { width: 100%; height: 50px; font-size: 16px; border: 1px solid #c7c7cc; border-radius: 8px; padding: 0 12px; box-sizing: border-box; background: #fff; margin-bottom: 15px; -webkit-appearance: none; }
        textarea { height: 100px; padding: 12px; resize: none; }
        input:focus, select:focus, textarea:focus { background: #fffdf0; border-color: #f39c12; outline: none; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        /* STATUS KNOPPEN */
        .status-container { display: flex; flex-direction: column; gap: 10px; }
        .btn-status { width: 100%; padding: 20px; border: 2px solid #d1d1d6; border-radius: 12px; font-size: 16px; font-weight: bold; text-align: left; background: #fff; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 15px; color: #3a3a3c; }
        
        .btn-status.groen.active { border-color: #34c759; background: #e8f8ec; color: #248a3d; }
        .btn-status.oranje.active { border-color: #ff9f0a; background: #fff4e5; color: #b26c00; }
        .btn-status.rood.active { border-color: #ff3b30; background: #ffebea; color: #b8201a; }
        
        .emoji { font-size: 24px; }

        /* SERVICE BLOK (VERBORGEN STANDAARD) */
        #service-blok { display: none; background: #fffdf0; border: 2px solid #f39c12; margin-top: -10px; border-radius: 0 0 12px 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* VERZEND KNOP */
        .btn-send { background: #007aff; color: white; width: 100%; padding: 18px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 30px; box-shadow: 0 4px 12px rgba(0,122,255,0.3); transition: 0.2s; }
        .btn-send:disabled { background: #8e8e93; box-shadow: none; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="app-container">
    <form id="opleverForm">
        
        <div class="card">
            <div class="card-title">📅 Kies Vandaag de Klus</div>
            <label>Actieve Geplande Orders</label>
            <select id="select_order" onchange="vulKlusGegevens()" required>
                <option value="">⏳ Laden van actieve klussen...</option>
            </select>
            <input type="hidden" id="order_nr">
        </div>
        
        <div class="card">
            <div class="card-title">📍 Waar ben je?</div>
            <label>Klantnaam</label>
            <input type="text" id="klant_naam" placeholder="Klantnaam" readonly style="background:#f2f2f7;" required>
            
            <label>Postcode & Huisnummer</label>
            <div class="grid-2">
                <input type="text" id="pc" placeholder="1234AB" style="text-transform: uppercase; background:#f2f2f7;" readonly required>
                <input type="text" id="hn" placeholder="Huisnr" readonly style="background:#f2f2f7;" required>
            </div>
            <input type="text" id="str" placeholder="Adres..." readonly style="background:#f2f2f7;">
        </div>

        <div class="card" style="border: none; box-shadow: none; padding: 0; background: transparent;">
            <div class="card-title" style="color: #1c1c1e; border-color: #1c1c1e;">📋 Status van de klus</div>
            <div class="status-container">
                <button type="button" class="btn-status groen" onclick="selectStatus('groen')">
                    <span class="emoji">🟢</span> 100% KLAAR & OPGELEVERD
                </button>
                <button type="button" class="btn-status oranje" onclick="selectStatus('oranje')">
                    <span class="emoji">🟠</span> DEELS KLAAR / SERVICE NODIG
                </button>
                <button type="button" class="btn-status rood" onclick="selectStatus('rood')">
                    <span class="emoji">🔴</span> NIET GEMONTEERD / AFGEBROKEN
                </button>
            </div>
        </div>

        <div id="service-blok">
            <h3 id="service-titel" style="margin-top: 0; color: #ff9f0a; font-size: 16px;">⚠️ Service Rapportage</h3>
            
            <label>Reden van melding</label>
            <select id="reden">
                <option value="">-- Kies de oorzaak --</option>
                <option>Onderdeel ontbreekt / defect</option>
                <option>Product beschadigd (Fabriek/Transport)</option>
                <option>Verkeerde maat geleverd / ingemeten</option>
                <option>Klant was niet thuis / geen stroom</option>
                <option>Slecht weer / gevaarlijk om te werken</option>
                <option>Anders (Zie toelichting)</option>
            </select>

            <label>Wat moet kantoor NIEUW bestellen/regelen?</label>
            <textarea id="bestellen" placeholder="Bijv: Nieuwe kap voor rolluik links, RAL 9001. Of: 1x afstandsbediening Situo 5."></textarea>

            <label>Tijdelijke oplossing / Gemaakte afspraak</label>
            <textarea id="oplossing" placeholder="Bijv: Rolluik hangt al wel, noodkabeltje naar binnen gelegd. Komen terug voor de zender."></textarea>

            <label>Voorstel Nieuwe Afspraak met de klant</label>
            <input type="date" id="nieuwe_datum">
        </div>

        <button type="submit" class="btn-send" id="btnSend">📤 MELDING VERZENDEN NAAR KANTOOR</button>

    </form>
</div>

<script>
    // VUL HIER JOUW EIGEN GOOGLE WEB APP URL IN !!
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbztM02X2Jpd2uzt9sdN2zBbGSIarMgRPI-MvIe0OsvrxY98TZ0ogUbImtQ3ilmQPuM/exec";

    let gekozenStatus = '';
    let alleActieveOrders = [];

    // AUTOMATISCH KLUSSEN INLADEN UIT PLANNING
    function laadActieveKlussen() {
        fetch(SCRIPT_URL + "?action=getMonteurOrders")
            .then(res => res.json())
            .then(data => {
                alleActieveOrders = data;
                let select = document.getElementById('select_order');
                select.innerHTML = '<option value="">-- Kies de klant voor vandaag --</option>';
                
                if(data.length === 0) {
                    select.innerHTML = '<option value="">🎉 Alle geplande klussen zijn al afgemeld!</option>';
                    return;
                }
                
                data.forEach((order, index) => {
                    select.innerHTML += `<option value="${index}">ORD: ${order.ordernummer} - ${order.naam}</option>`;
                });
            }).catch(err => {
                document.getElementById('select_order').innerHTML = '<option value="">❌ Fout bij laden planning...</option>';
            });
    }

    // AUTO-FILL LOGICA ALS DE MONTEUR DE KLANT KIEST
    function vulKlusGegevens() {
        let selectVal = document.getElementById('select_order').value;
        if(selectVal === "") {
            document.getElementById('order_nr').value = "";
            document.getElementById('klant_naam').value = "";
            document.getElementById('pc').value = "";
            document.getElementById('hn').value = "";
            document.getElementById('str').value = "";
            return;
        }
        
        let gekozenOrder = alleActieveOrders[selectVal];
        document.getElementById('order_nr').value = gekozenOrder.ordernummer;
        document.getElementById('klant_naam').value = gekozenOrder.naam;
        document.getElementById('pc').value = gekozenOrder.postcode;
        document.getElementById('hn').value = gekozenOrder.huisnummer;
        document.getElementById('str').value = gekozenOrder.adres;
    }

    // STATUS KNOPPEN LOGICA
    function selectStatus(status) {
        gekozenStatus = status;
        document.querySelectorAll('.btn-status').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.btn-status.${status}`).classList.add('active');

        const serviceBlok = document.getElementById('service-blok');
        const serviceTitel = document.getElementById('service-titel');
        const redenSelect = document.getElementById('reden');

        if (status === 'groen') {
            serviceBlok.style.display = 'none';
            redenSelect.required = false;
        } else {
            serviceBlok.style.display = 'block';
            redenSelect.required = true;
            
            if (status === 'oranje') {
                serviceTitel.innerHTML = '🟠 Service Nodig (Deels Opgeleverd)';
                serviceTitel.style.color = '#ff9f0a';
                serviceBlok.style.borderColor = '#ff9f0a';
            } else if (status === 'rood') {
                serviceTitel.innerHTML = '🔴 Probleem Melding (Niet Gemonteerd)';
                serviceTitel.style.color = '#ff3b30';
                serviceBlok.style.borderColor = '#ff3b30';
            }
        }
    }

    // CODES DIRECT RECHTSTREEKS NAAR GOOGLE SHEETS STUREN
    document.getElementById('opleverForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        let ordernummer = document.getElementById('order_nr').value;
        if (!ordernummer) {
            alert("Kies eerst bovenaan een geplande klus!");
            return;
        }

        if (!gekozenStatus) {
            alert("Kies eerst een status (Groen, Oranje of Rood)!");
            return;
        }

        const btn = document.getElementById('btnSend');
        btn.disabled = true;
        btn.innerText = "⏳ Bezig met verwerken in agenda...";

        let actieScript = "";
        let notitieInfo = "";

        if (gekozenStatus === 'groen') {
            actieScript = "markOpgeleverd";
        } else {
            actieScript = gekozenStatus === 'oranje' ? "markService" : "markAfgebroken";
            
            // Verzamel alle invoer van de monteur in een duidelijke notitie voor op het kalenderblokje
            let reden = document.getElementById('reden').value;
            let bestellen = document.getElementById('bestellen').value || "Niets ingevuld";
            let oplossing = document.getElementById('oplossing').value || "Niets ingevuld";
            let datum = document.getElementById('nieuwe_datum').value || "Geen datum afgesproken";
            
            notitieInfo = `⚠️ REDEN: ${reden}\n📦 BESTELLEN: ${bestellen}\n🔧 AFSPRAAK: ${oplossing}\n📅 NIEUWE DATUM: ${datum}`;
        }
        
        // Stuur keihard door naar Google Sheets!
        fetch(`${SCRIPT_URL}?action=${actieScript}&ordernummer=${ordernummer}&notitie=${encodeURIComponent(notitieInfo)}`)
        .then(res => res.json())
        .then(data => {
            alert("✅ Status succesvol verwerkt! Agenda op kantoor is direct bijgewerkt.");
            location.reload(); 
        }).catch(err => {
            alert("❌ Er ging iets mis met de verbinding. Probeer het opnieuw.");
            btn.disabled = false;
            btn.innerText = "📤 MELDING VERZENDEN NAAR KANTOOR";
        });
    });

    // Start direct met inladen van geplande orders
    laadActieveKlussen();
</script>

</body>
</html>
