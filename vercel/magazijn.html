<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magazijn Pro | Sombre</title>
    <!-- Tailwind CSS voor een professioneel uiterlijk zonder veel code -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTML5 QRCode Scanner Bibliotheek (Voor Optie 4) -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hidden { display: none !important; }
        .status-badge { font-weight: bold; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; }
        
        .status-binnen { background-color: #fef08a; color: #854d0e; } /* Geel */
        .status-wacht { background-color: #e5e7eb; color: #374151; }  /* Grijs */
        .status-bellen { background-color: #fecaca; color: #991b1b; } /* Rood */
        .status-deels { background-color: #fef9c3; color: #a16207; }  /* Goud/Geel */

        #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 10px; overflow: hidden; }
    </style>
</head>
<body class="p-4">

    <!-- Header met Terug-knop -->
    <div class="max-w-2xl mx-auto mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-extrabold text-gray-800">Magazijn & Intake</h1>
            <p class="text-gray-500">Sombre Zonwering Orders</p>
        </div>
        
        <!-- De Retourknop -->
        <a href="intake-order.html" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg transition-colors text-sm shadow-sm flex items-center">
            ⬅️ Order Intake
        </a>
    </div>

    <!-- Controle Paneel (Zoeken & Filters) -->
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-sm p-4 mb-6 border border-gray-100">
        
        <!-- Optie 2 & 4: Zoekbalk & Scanner -->
        <div class="flex gap-2 mb-4">
            <input type="text" id="searchInput" placeholder="🔍 Zoek op klant, plaats of order..." 
                   class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 shadow-inner">
            
            <button onclick="startScanner()" class="bg-gray-800 hover:bg-gray-700 text-white rounded-lg px-4 py-2 font-bold shadow-md transition-all flex items-center justify-center">
                📷 Scan
            </button>
        </div>

        <!-- Scanner Weergave (Verborgen tot geklikt) -->
        <div id="scanner-container" class="hidden mb-4 p-2 bg-gray-900 rounded-lg">
            <div id="reader"></div>
            <button onclick="stopScanner()" class="mt-2 w-full bg-red-600 text-white py-2 rounded-lg font-bold">Sluit Camera</button>
        </div>

        <!-- Optie 1: Filters -->
        <div class="flex overflow-x-auto gap-2 pb-2" id="filter-buttons">
            <button onclick="setFilter('Alles')" class="filter-btn bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-sm">Alles Tonen</button>
            <button onclick="setFilter('Wacht op Producten')" class="filter-btn bg-gray-100 text-gray-700 hover:bg-gray-200 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap">Wacht op Prod.</button>
            <button onclick="setFilter('Klant Bellen')" class="filter-btn bg-gray-100 text-gray-700 hover:bg-gray-200 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap">Klant Bellen</button>
            <button onclick="setFilter('Deels Binnen')" class="filter-btn bg-gray-100 text-gray-700 hover:bg-gray-200 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap">Deels Binnen</button>
        </div>
    </div>

    <!-- Order Lijst -->
    <div id="loader" class="text-center py-10 font-bold text-gray-500">Orders inladen vanaf server... ⏳</div>
    <div id="order-container" class="max-w-2xl mx-auto space-y-4">
        <!-- Orders worden hier via JavaScript opgebouwd -->
    </div>

<script>
    // ⚠️ PLAK HIER JOUW APPS SCRIPT URL!
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbztM02X2Jpd2uzt9sdN2zBbGSIarMgRPI-MvIe0OsvrxY98TZ0ogUbImtQ3ilmQPuM/exec";
    
    let allOrders = [];
    let currentFilter = 'Alles';
    let html5QrcodeScanner = null;

    // --- Optie 3: Controleer of we via de Agenda Link (URL parameter) komen ---
    const urlParams = new URLSearchParams(window.location.search);
    const urlOrderToLoad = urlParams.get('order'); // Haalt bijv '61415' uit de URL

    // --- Initialisatie & Data ophalen ---
    async function loadOrders() {
        try {
            const res = await fetch(WEB_APP_URL + "?action=getOrders");
            allOrders = await res.json();
            document.getElementById('loader').classList.add('hidden');
            
            // Als er een URL parameter is, zet die direct in de zoekbalk!
            if (urlOrderToLoad) {
                document.getElementById('searchInput').value = urlOrderToLoad;
            }

            renderOrders();
        } catch(e) {
            document.getElementById('loader').innerText = "Fout bij inladen. Controleer URL.";
        }
    }

    // --- Optie 1: Filtering instellen ---
    function setFilter(status) {
        currentFilter = status;
        
        // Update kleuren van de knoppen
        document.querySelectorAll('.filter-btn').forEach(btn => {
            if (btn.innerText.includes(status) || (status === 'Alles' && btn.innerText === 'Alles Tonen')) {
                btn.className = "filter-btn bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-sm";
            } else {
                btn.className = "filter-btn bg-gray-100 text-gray-700 hover:bg-gray-200 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap";
            }
        });

        renderOrders();
    }

    // --- Optie 2: Live Zoekbalk events koppelen ---
    document.getElementById('searchInput').addEventListener('keyup', function() {
        renderOrders(); // Filtert live bij elke letter die getypt wordt
    });

    // --- Render Motor (Toont alleen wat door filter & zoekbalk komt) ---
    function renderOrders() {
        const container = document.getElementById('order-container');
        container.innerHTML = '';
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();

        let visibleCount = 0;

        allOrders.forEach(order => {
            // 1. Controleer of status overeenkomt met de filterknop
            let matchStatus = false;
            if (currentFilter === 'Alles') matchStatus = true;
            else if (currentFilter === 'Klant Bellen' && order.status.includes('Klant Bellen')) matchStatus = true;
            else if (order.status === currentFilter) matchStatus = true;

            // 2. Controleer of de zoekterm voorkomt in Naam, Ordernummer of Product
            let matchSearch = true;
            if (searchTerm !== "") {
                const textStr = (order.ordernummer + " " + order.naam + " " + order.producten).toLowerCase();
                if (!textStr.includes(searchTerm)) matchSearch = false;
            }

            // Alleen renderen als beide waar zijn
            if (matchStatus && matchSearch) {
                visibleCount++;
                container.appendChild(buildOrderCard(order));
            }
        });

        if (visibleCount === 0) {
            container.innerHTML = `<div class="text-center py-8 text-gray-400 font-bold">Geen orders gevonden voor deze zoekopdracht/filter.</div>`;
        }
    }

    // --- Bouwt het HTML blokje voor 1 order ---
    function buildOrderCard(order) {
        let badgeClass = 'status-wacht';
        if (order.status.includes('Binnen')) badgeClass = 'status-binnen';
        if (order.status.includes('Klant Bellen')) badgeClass = 'status-bellen';
        if (order.status.includes('Deels')) badgeClass = 'status-deels';

        const div = document.createElement('div');
        div.className = "bg-white rounded-xl shadow-sm border border-gray-200 p-5";
        div.innerHTML = `
            <div class="flex justify-between items-start mb-2">
                <div>
                    <div class="text-xs text-gray-500 font-bold mb-1">ORD: ${order.ordernummer}</div>
                    <div class="text-lg font-extrabold text-gray-900">${order.naam}</div>
                </div>
                <span class="status-badge ${badgeClass}">${order.status}</span>
            </div>
            <div class="text-sm text-gray-600 mb-4 bg-gray-50 p-3 rounded border border-gray-100">📦 ${order.producten}</div>
            
            <div class="grid grid-cols-2 gap-2 mt-4 pt-4 border-t border-gray-100">
                <button onclick="updateStatus('${order.ordernummer}', 'markPartial')" class="bg-yellow-100 hover:bg-yellow-200 text-yellow-800 py-2 rounded-lg font-bold text-sm transition-colors">⚠️ Deels Binnen</button>
                <button onclick="updateStatus('${order.ordernummer}', 'markBinnen')" class="bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-bold text-sm transition-colors shadow-sm">✅ Alles Binnen</button>
            </div>
        `;
        return div;
    }

    // --- Verzenden naar Achterkant ---
    async function updateStatus(ordernummer, action) {
        let loc = "";
        if(action === 'markBinnen' || action === 'markPartial') {
            loc = prompt(`Magazijn Locatie (optioneel) voor ORD ${ordernummer}:`);
            if (loc === null) return; // Geannuleerd
        }
        
        // Optimistisch updaten (verander direct op scherm voor snelheid)
        allOrders.forEach(o => {
            if(o.ordernummer === ordernummer) {
                if (action === 'markBinnen') o.status = "Producten Binnen (Klant Bellen)";
                if (action === 'markPartial') o.status = "Deels Binnen";
            }
        });
        renderOrders(); // Ververs scherm

        // Push naar backend
        await fetch(WEB_APP_URL + "?action=" + action + "&ordernummer=" + ordernummer + "&locatieInfo=" + encodeURIComponent(loc || ""));
    }

    // --- Optie 4: Barcode / QR Scanner Engine ---
    function startScanner() {
        document.getElementById('scanner-container').classList.remove('hidden');
        if (!html5QrcodeScanner) {
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 100} }, false);
        }
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    function stopScanner() {
        if (html5QrcodeScanner) { html5QrcodeScanner.clear(); }
        document.getElementById('scanner-container').classList.add('hidden');
    }

    function onScanSuccess(decodedText, decodedResult) {
        // Zodra een barcode gescand is, stopt de camera en vult de zoekbalk zich
        stopScanner();
        document.getElementById('searchInput').value = decodedText;
        setFilter('Alles'); // Zorg dat we niet op een verkeerde tab staan
        // Automatisch renderOrders() wordt nu aangeroepen via setFilter
    }

    function onScanFailure(error) { /* genegeerd tijdens scannen */ }

    // Start inladen bij openen
    loadOrders();
</script>
</body>
</html>
