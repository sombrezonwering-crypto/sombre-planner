<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magazijn Pro | Sombre ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/nl.js"></script>

    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overscroll-behavior-y: contain; }
        .hidden { display: none !important; }
        .status-badge { font-weight: bold; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; }
        .status-binnen { background-color: #fef08a; color: #854d0e; } 
        .status-wacht { background-color: #e5e7eb; color: #374151; }  
        .status-bellen { background-color: #fecaca; color: #991b1b; } 
        .status-deels { background-color: #fef9c3; color: #a16207; }
        .status-service { background-color: #bfdbfe; color: #1e3a8a; }
        
        /* Nieuwe Geplande Kleuren! */
        .status-definitief { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; } /* Groen voor Montage */
        .status-service-gepland { background-color: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; } /* Blauw voor Service */
        
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 10px; overflow: hidden; }
        .flatpickr-calendar { margin: 0 auto; box-shadow: none !important; border: 1px solid #e5e7eb; border-radius: 0.5rem; }
        #ptr-indicator { height: 0; overflow: hidden; transition: height 0.2s; text-align: center; color: #6b7280; font-weight: bold; }
    </style>
</head>
<body class="p-4">

    <div id="ptr-indicator" class="flex items-center justify-center text-sm">
        ⬇️ Laat los om te vernieuwen...
    </div>

    <div class="max-w-2xl mx-auto mb-6 flex justify-between items-center mt-2">
        <div>
            <h1 class="text-3xl font-extrabold text-gray-800">Magazijn & Intake</h1>
            <p class="text-gray-500">Sombre ERP Systeem</p>
        </div>
        <a href="intake-order.html" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg transition-colors text-sm shadow-sm flex items-center">
            ⬅️ Order Intake
        </a>
    </div>

    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-sm p-4 mb-6 border border-gray-100">
        <div class="flex gap-2 mb-4">
            <input type="text" id="searchInput" placeholder="🔍 Zoek op klant of order..." class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 shadow-inner">
            <button onclick="startScanner()" class="bg-gray-800 hover:bg-gray-700 text-white rounded-lg px-4 py-2 font-bold shadow-md transition-all flex items-center justify-center">📷 Scan</button>
        </div>
        
        <div id="scanner-container" class="hidden mb-4 p-2 bg-gray-900 rounded-lg">
            <div id="reader"></div>
            <button onclick="stopScanner()" class="mt-2 w-full bg-red-600 text-white py-2 rounded-lg font-bold">Sluit Camera</button>
        </div>

        <div class="flex overflow-x-auto gap-2 pb-2" id="filter-buttons">
            <button onclick="setFilter('Alles')" class="filter-btn bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-sm">Alles Tonen</button>
            <button onclick="setFilter('Gepland')" class="filter-btn bg-green-100 text-green-800 hover:bg-green-200 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap border border-green-200">✅ Gepland Klaarzetten</button>
            <button onclick="setFilter('Service & Spoed')" class="filter-btn bg-red-100 text-red-800 border border-red-200 hover:bg-red-200 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-sm">🛠️ Service & Spoed</button>
            <button onclick="setFilter('Wacht op Prod.')" class="filter-btn bg-gray-100 text-gray-700 hover:bg-gray-200 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap border border-transparent">Wacht op Prod.</button>
            <button onclick="setFilter('Klant Bellen')" class="filter-btn bg-gray-100 text-gray-700 hover:bg-gray-200 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap border border-transparent">Klant Bellen</button>
            <button onclick="setFilter('Deels Binnen')" class="filter-btn bg-gray-100 text-gray-700 hover:bg-gray-200 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap border border-transparent">Deels Binnen</button>
        </div>
    </div>

    <div id="loader" class="text-center py-10 font-bold text-gray-500">Orders inladen vanaf server... ⏳</div>
    <div id="order-container" class="max-w-2xl mx-auto space-y-4"></div>

    <div id="herplanModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-60 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-lg p-5 max-w-sm w-full border-2 border-blue-500 max-h-[95vh] overflow-y-auto">
            <h3 class="text-xl font-extrabold text-gray-800 mb-1">📅 Klant Herplannen</h3>
            <p class="text-xs text-gray-500 mb-4 border-b pb-2">Verplaatst de order direct en maakt de status definitief (Akkoord).</p>
            
            <input type="hidden" id="herplanOrderNr">
            
            <label class="block text-xs font-bold text-gray-700 mb-1.5">Snelkeuze datum:</label>
            <div class="grid grid-cols-3 gap-1.5 mb-4">
                <button type="button" onclick="setSnelkeuzeDatum(1)" class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-2 rounded text-xs border border-blue-200 transition-colors">Morgen</button>
                <button type="button" onclick="setSnelkeuzeDatum(7)" class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-2 rounded text-xs border border-blue-200 transition-colors">Volgende week</button>
                <button type="button" onclick="setSnelkeuzeDatum(14)" class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-2 rounded text-xs border border-blue-200 transition-colors">+2 Weken</button>
            </div>
            
            <label class="block text-xs font-bold text-gray-700 mb-1">Of selecteer in maandoverzicht:</label>
            <div class="mb-2 flex justify-center">
                <input type="text" id="visueleKalenderInput" class="hidden">
            </div>
            <div id="kalenderFeedback" class="text-center text-sm font-bold text-green-700 bg-green-100 py-2 mt-2 rounded-lg transition-all opacity-0 hidden"></div>
            
            <label class="block text-xs font-bold text-gray-700 mb-1 mt-4">Specifieke Tijd (Optioneel)</label>
            <input type="time" id="nieuweTijd" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 mb-5 focus:ring-blue-500 text-sm">
            
            <div class="flex gap-2">
                <button onclick="sluitHerplanModal()" class="w-1/3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2.5 rounded-lg border border-gray-300 text-sm transition-colors">Annuleer</button>
                <button id="herplanSubmitBtn" onclick="verstuurHerplanning()" class="w-2/3 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg shadow-md text-sm transition-colors">✅ Verplaats Order</button>
            </div>
        </div>
    </div>

<script>
    // VUL HIER JOUW NIEUWE GOOGLE APPS SCRIPT URL IN
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw8XNAycvrJWLnKYxP5ulFmbCZUrLNtb0Etc9-HteUcsdtLU9P90QiKhqumPaKxaqc/exec";
    
    let allOrders = [];
    let currentFilter = 'Alles';
    let html5QrcodeScanner = null;
    let kalenderInstance = null; 
    let scanErrorTimeout = null;
    const urlParams = new URLSearchParams(window.location.search);
    const urlOrderToLoad = urlParams.get('order'); 

    function escapeHTML(str) {
        if (!str) return "";
        return str.toString().replace(/[&<>'"]/g, 
            tag => ({ '&': '&', '<': '<', '>': '>', "'": ''', '"': '"' }[tag] || tag)
        );
    }

    document.addEventListener("DOMContentLoaded", function() {
        kalenderInstance = flatpickr("#visueleKalenderInput", {
            inline: true,          
            locale: "nl",          
            dateFormat: "Y-m-d",   
            minDate: "today",      
            defaultDate: "today",
            onChange: function(selectedDates, dateStr, instance) {
                if (selectedDates.length > 0) {
                    const options = { weekday: 'long', day: 'numeric', month: 'long' };
                    const mooieDatum = selectedDates[0].toLocaleDateString('nl-NL', options);
                    let feedbackDiv = document.getElementById("kalenderFeedback");
                    feedbackDiv.innerText = `✅ Geselecteerd: ${mooieDatum}`;
                    feedbackDiv.classList.remove("hidden");
                    feedbackDiv.style.opacity = "1"; 
                }
            }
        });
        setupPullToRefresh();
        loadOrders();
    });

    function setupPullToRefresh() {
        let touchstartY = 0;
        const ptr = document.getElementById('ptr-indicator');
        
        document.addEventListener('touchstart', e => { if (window.scrollY === 0) touchstartY = e.touches[0].clientY; }, {passive: true});
        document.addEventListener('touchmove', e => { if (window.scrollY === 0 && touchstartY > 0) { let currentY = e.touches[0].clientY; if (currentY - touchstartY > 60) ptr.style.height = '40px'; } }, {passive: true});
        document.addEventListener('touchend', e => {
            if (window.scrollY === 0 && touchstartY > 0) {
                let touchendY = e.changedTouches[0].clientY;
                if (touchendY - touchstartY > 80) {
                    ptr.innerText = "🔄 Vernieuwen...";
                    loadOrders().then(() => { ptr.style.height = '0'; setTimeout(() => ptr.innerText = "⬇️ Laat los om te vernieuwen...", 300); });
                } else { ptr.style.height = '0'; }
                touchstartY = 0;
            }
        }, {passive: true});
    }

    function setSnelkeuzeDatum(dagenErbij) {
        let doelDatum = new Date(); doelDatum.setDate(doelDatum.getDate() + dagenErbij);
        if (kalenderInstance) kalenderInstance.setDate(doelDatum, true); 
    }

    async function loadOrders() {
        document.getElementById('loader').classList.remove('hidden');
        document.getElementById('loader').innerText = "Orders inladen vanaf server... ⏳";
        
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000); 

        try {
            const res = await fetch(WEB_APP_URL + "?action=getOrders", { signal: controller.signal });
            clearTimeout(timeoutId);
            allOrders = await res.json();
            document.getElementById('loader').classList.add('hidden');
            if (urlOrderToLoad) document.getElementById('searchInput').value = escapeHTML(urlOrderToLoad);
            renderOrders();
        } catch(e) {
            clearTimeout(timeoutId);
            if (e.name === 'AbortError') document.getElementById('loader').innerText = "❌ Server reageert niet (Timeout). Probeer het later opnieuw.";
            else document.getElementById('loader').innerText = "❌ Fout bij inladen. Controleer URL of internetverbinding.";
        }
    }

    function setFilter(status) {
        currentFilter = status;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            if (btn.innerText.includes(status) || (status === 'Alles' && btn.innerText === 'Alles Tonen')) {
                btn.className = "filter-btn bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-sm border border-transparent";
                if (status === 'Service & Spoed') btn.className = "filter-btn bg-red-600 text-white px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-sm border border-transparent";
                if (status === 'Gepland') btn.className = "filter-btn bg-green-600 text-white px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-sm border border-transparent";
            } else {
                btn.className = "filter-btn bg-gray-100 text-gray-700 hover:bg-gray-200 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap border border-transparent";
                if (btn.innerText.includes('Service & Spoed')) btn.className = "filter-btn bg-red-50 text-red-800 hover:bg-red-100 border border-red-200 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap";
                if (btn.innerText.includes('Gepland')) btn.className = "filter-btn bg-green-50 text-green-800 hover:bg-green-100 border border-green-200 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap";
            }
        });
        renderOrders();
    }

    document.getElementById('searchInput').addEventListener('keyup', renderOrders);

    function renderOrders() {
        const container = document.getElementById('order-container'); container.innerHTML = '';
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        let visibleCount = 0;
        
        allOrders.forEach(order => {
            // "Opgeleverd" wordt aan de backend al gefilterd, maar voor veiligheid:
            if (order.status === "Opgeleverd") return; 

            let matchStatus = false;
            let orderStatLower = order.status.toLowerCase();

            if (currentFilter === 'Alles') matchStatus = true;
            else if (currentFilter === 'Wacht op Prod.' && orderStatLower.includes('wacht')) matchStatus = true;
            else if (currentFilter === 'Klant Bellen' && orderStatLower.includes('bellen')) matchStatus = true;
            else if (currentFilter === 'Deels Binnen' && orderStatLower.includes('deels')) matchStatus = true;
            else if (currentFilter === 'Service & Spoed' && (orderStatLower.includes('service') || orderStatLower.includes('spoed'))) matchStatus = true;
            else if (currentFilter === 'Gepland' && (orderStatLower.includes('definitief') || orderStatLower.includes('gepland'))) matchStatus = true;

            let matchSearch = true;
            if (searchTerm !== "") {
                const textStr = (order.ordernummer + " " + order.naam + " " + order.producten).toLowerCase();
                if (!textStr.includes(searchTerm)) matchSearch = false;
            }

            // FILTER FIX: We sluiten 'Definitief' NIET meer uit!
            if (matchStatus && matchSearch) {
                visibleCount++; 
                container.appendChild(buildOrderCard(order));
            }
        });

        if (visibleCount === 0) {
            container.innerHTML = `<div class="text-center py-8 text-gray-400 font-bold">Geen openstaande orders gevonden in dit overzicht.</div>`;
        }
    }

    function buildOrderCard(order) {
        const safeOrderNummer = escapeHTML(order.ordernummer);
        const safeNaam = escapeHTML(order.naam);
        const safeStatus = escapeHTML(order.status);
        const safeProducten = escapeHTML(order.producten);
        const safeBron = escapeHTML(order.bron);
        const safeAdres = escapeHTML(order.adres);
        
        let badgeClass = 'status-wacht';
        let orderStatLower = safeStatus.toLowerCase();
        
        // Bepaal de juiste badge-kleur, nu mét Groen en Blauw!
        if (orderStatLower.includes('binnen')) badgeClass = 'status-binnen';
        if (orderStatLower.includes('bellen') || orderStatLower.includes('spoed')) badgeClass = 'status-bellen';
        if (orderStatLower.includes('deels')) badgeClass = 'status-deels';
        if (orderStatLower.includes('service nodig') || orderStatLower === 'service') badgeClass = 'status-service';
        if (orderStatLower.includes('definitief')) badgeClass = 'status-definitief';
        if (orderStatLower.includes('service gepland')) badgeClass = 'status-service-gepland';

        let planTekst = "Nog niet ingepland";
        if (order.planningsBericht && (order.planningsBericht.includes("Gepland op") || order.planningsBericht.includes("Geplanned op") || order.planningsBericht.includes("Handmatig"))) {
            planTekst = escapeHTML(order.planningsBericht.replace("Gepland op ", "").replace("Geplanned op ", "").split("\n")[0].replace(/'/g, ""));
        }
        
        let tijdTekst = "";
        if (order.vasteTijd) tijdTekst = ` | 🕒 ${escapeHTML(order.vasteTijd)}`;
        else if (order.voorkeur && order.voorkeur !== "Geen") tijdTekst = ` | 🕒 ${escapeHTML(order.voorkeur)}`;

        let bronPill = "";
        if (safeBron && safeBron !== "Sombre") {
            bronPill = `<span class="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded ml-2 font-bold border border-blue-200">🏢 ${safeBron}</span>`;
        }

        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(order.adres || '')}`;
        
        // SLIMME KNOPPEN: Als het al gepland is, verbergen we Binnen/Deels/Akkoord!
        const isReedsGepland = orderStatLower.includes('definitief') || orderStatLower.includes('service gepland');

        let actieKnoppen = '';
        if (!isReedsGepland) {
            actieKnoppen = `
                <button onclick="updateStatus('${safeOrderNummer}', 'markPartial', this)" class="bg-yellow-100 hover:bg-yellow-200 text-yellow-800 py-2 rounded-lg font-bold text-sm border border-transparent">⚠️ Deels</button>
                <button onclick="updateStatus('${safeOrderNummer}', 'markBinnen', this)" class="bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-bold text-sm border border-transparent">✅ Binnen</button>
                <button onclick="updateStatus('${safeOrderNummer}', 'markGreen', this)" class="col-span-2 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-bold text-sm mt-1 border border-transparent">🤝 Akkoord (Maak Definitief)</button>
            `;
        }

        const div = document.createElement('div'); 
        div.className = "bg-white rounded-xl shadow-sm border border-gray-200 p-5";
        div.innerHTML = `
            <div class="flex justify-between items-start mb-2">
                <div>
                    <div class="text-xs text-gray-500 font-bold mb-1 flex items-center">ORD: ${safeOrderNummer} ${bronPill}</div>
                    <div class="text-lg font-extrabold text-gray-900">${safeNaam}</div>
                </div>
                <span class="status-badge ${badgeClass} text-center leading-tight">${safeStatus}</span>
            </div>
            
            <div class="text-sm text-blue-800 bg-blue-50 p-2 rounded-lg border border-blue-100 font-bold mb-3 flex items-center shadow-inner">
                📅 ${planTekst}${tijdTekst}
            </div>

            <div class="text-sm text-gray-600 mb-4 bg-gray-50 p-3 rounded border border-gray-100 whitespace-pre-wrap">📦 ${safeProducten}</div>
            
            <div class="grid grid-cols-2 gap-2 mt-4 pt-4 border-t border-gray-100">
                ${actieKnoppen}
                
                <button onclick="openHerplanModal('${safeOrderNummer}')" class="${isReedsGepland ? 'col-span-1' : 'col-span-2'} bg-purple-100 hover:bg-purple-200 text-purple-800 py-2 rounded-lg font-bold text-sm mt-1 border border-purple-200">📅 Herplannen</button>
                
                <a href="${mapUrl}" target="_blank" class="${isReedsGepland ? 'col-span-1' : 'col-span-2'} bg-gray-100 hover:bg-gray-200 text-gray-800 py-2 rounded-lg font-bold text-sm border border-gray-300 flex items-center justify-center mt-1 transition-colors">
                    🗺️ Navigeer
                </a>

                <button onclick="updateStatus('${safeOrderNummer}', 'markFinished', this)" class="col-span-2 bg-gray-800 hover:bg-black text-white py-3 rounded-lg font-bold text-sm mt-2 border border-gray-700 transition-colors shadow-md">
                    🏁 Klus Afronden (Verberg)
                </button>
            </div>
        `; 
        return div;
    }

    async function updateStatus(ordernummer, action, btnElement) {
        let loc = "";
        if(action === 'markBinnen' || action === 'markPartial') {
            loc = prompt(`Magazijn Locatie (optioneel) voor ORD ${ordernummer}:`);
            if (loc === null) return;
        }

        const isCriticalAction = (action === 'markFinished' || action === 'markGreen');
        const oldBtnText = btnElement.innerText;

        if (isCriticalAction) {
            btnElement.innerText = "⏳...";
            btnElement.disabled = true;
        } else {
            allOrders.forEach(o => {
                if(o.ordernummer === ordernummer) {
                    if (action === 'markBinnen') o.status = "Producten Binnen (Klant Bellen)";
                    if (action === 'markPartial') o.status = "Deels Binnen";
                }
            });
            renderOrders();
        }
        
        try {
            const res = await fetch(WEB_APP_URL + "?action=" + action + "&ordernummer=" + encodeURIComponent(ordernummer) + "&locatieInfo=" + encodeURIComponent(loc || ""));
            const resultaat = await res.json();

            if (resultaat.status === "ok" && isCriticalAction) {
                allOrders.forEach(o => {
                    if(o.ordernummer === ordernummer) {
                        if (action === 'markGreen') o.status = "Definitief"; 
                        if (action === 'markFinished') o.status = "Opgeleverd"; 
                    }
                });
                renderOrders();
            } else if (resultaat.status !== "ok") {
                alert("❌ Fout vanuit de backend: " + resultaat.message);
                if (isCriticalAction) { btnElement.innerText = oldBtnText; btnElement.disabled = false; }
            }
        } catch(e) {
            alert("❌ Netwerkfout bij het updaten van de status.");
            if (isCriticalAction) { btnElement.innerText = oldBtnText; btnElement.disabled = false; }
        }
    }

    function openHerplanModal(ordernummer) {
        document.getElementById('herplanOrderNr').value = ordernummer;
        if (kalenderInstance) kalenderInstance.setDate(new Date(), false); 
        let feedbackDiv = document.getElementById("kalenderFeedback");
        if (feedbackDiv) { feedbackDiv.classList.add("hidden"); feedbackDiv.style.opacity = "0"; }
        document.getElementById('herplanModal').classList.remove('hidden');
    }

    function sluitHerplanModal() {
        document.getElementById('herplanModal').classList.add('hidden');
        document.getElementById('nieuweTijd').value = '';
    }

    async function verstuurHerplanning() {
        const ordernummer = document.getElementById('herplanOrderNr').value;
        const datum = kalenderInstance ? kalenderInstance.input.value : "";
        const tijd = document.getElementById('nieuweTijd').value;
        
        if (!datum) { alert("⚠️ Selecteer a.u.b. een nieuwe datum!"); return; }
        
        const btn = document.getElementById('herplanSubmitBtn');
        const oudeTekst = btn.innerText;
        btn.innerText = "⏳ Bezig met verplaatsen...";
        btn.disabled = true;
        
        try {
            const response = await fetch(WEB_APP_URL + "?action=herplanDefinitief&ordernummer=" + encodeURIComponent(ordernummer) + "&nieuweDatum=" + encodeURIComponent(datum) + "&nieuweTijd=" + encodeURIComponent(tijd));
            const resultaat = await response.json(); 
            
            if (resultaat.status === "ok") {
                sluitHerplanModal();
                allOrders.forEach(o => { if(o.ordernummer === ordernummer) o.status = "Definitief"; });
                renderOrders();
            } else {
                alert("❌ De planning is geweigerd door de sheet:\n" + escapeHTML(resultaat.message || resultaat.bericht || "Onbekende fout"));
            }
        } catch(e) {
            alert("❌ Netwerkfout. Controleer je internetverbinding.");
        } finally {
            btn.innerText = oudeTekst;
            btn.disabled = false;
        }
    }

    function startScanner() {
        document.getElementById('scanner-container').classList.remove('hidden');
        if (!html5QrcodeScanner) html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 100} }, false);
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }
    
    function stopScanner() { 
        if (html5QrcodeScanner) html5QrcodeScanner.clear(); 
        document.getElementById('scanner-container').classList.add('hidden'); 
    }
    
    function onScanSuccess(decodedText) { 
        stopScanner(); 
        document.getElementById('searchInput').value = escapeHTML(decodedText); 
        setFilter('Alles'); 
    }
    
    function onScanFailure(error) {
        clearTimeout(scanErrorTimeout);
        scanErrorTimeout = setTimeout(() => { console.debug("Scan fout/bezig:", error); }, 1000);
    }
</script>
</body>
</html>
