<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magazijn Pro | Sombre</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hidden { display: none !important; }
        .status-badge { font-weight: bold; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; }
        .status-binnen { background-color: #fef08a; color: #854d0e; } 
        .status-wacht { background-color: #e5e7eb; color: #374151; }  
        .status-bellen { background-color: #fecaca; color: #991b1b; } 
        .status-deels { background-color: #fef9c3; color: #a16207; }  
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 10px; overflow: hidden; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-2xl mx-auto mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-extrabold text-gray-800">Magazijn & Intake</h1>
            <p class="text-gray-500">Sombre Zonwering Orders</p>
        </div>
        <a href="intake-order.html" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg transition-colors text-sm shadow-sm flex items-center">
            ⬅️ Order Intake
        </a>
    </div>

    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-sm p-4 mb-6 border border-gray-100">
        <div class="flex gap-2 mb-4">
            <input type="text" id="searchInput" placeholder="🔍 Zoek op klant of order..." class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3 shadow-inner">
            <button onclick="startScanner()" class="bg-gray-800 hover:bg-gray-700 text-white rounded-lg px-4 py-2 font-bold shadow-md transition-all flex items-center justify-center">📷 Scan</button>
        </div>
        
        <div id="scanner-container" class="hidden mb-4 p-2 bg-gray-900 rounded-lg">
            <div id="reader"></div>
            <button onclick="stopScanner()" class="mt-2 w-full bg-red-600 text-white py-2 rounded-lg font-bold">Sluit Camera</button>
        </div>

        <div class="flex overflow-x-auto gap-2 pb-2" id="filter-buttons">
            <button onclick="setFilter('Alles')" class="filter-btn bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-sm">Alles Tonen</button>
            <button onclick="setFilter('Wacht op Producten')" class="filter-btn bg-gray-100 text-gray-700 hover:bg-gray-200 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap">Wacht op Prod.</button>
            <button onclick="setFilter('Klant Bellen')" class="filter-btn bg-gray-100 text-gray-700 hover:bg-gray-200 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap">Klant Bellen</button>
            <button onclick="setFilter('Deels Binnen')" class="filter-btn bg-gray-100 text-gray-700 hover:bg-gray-200 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap">Deels Binnen</button>
        </div>
    </div>

    <div id="loader" class="text-center py-10 font-bold text-gray-500">Orders inladen vanaf server... ⏳</div>
    <div id="order-container" class="max-w-2xl mx-auto space-y-4"></div>

    <div id="herplanModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-60 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-lg p-6 max-w-sm w-full border-2 border-blue-500">
            <h3 class="text-xl font-extrabold text-gray-800 mb-2">📅 Klant Herplannen</h3>
            <p class="text-sm text-gray-500 mb-5 border-b pb-4">De oude afspraak wordt gewist uit de agenda, verplaatst en direct gemarkeerd als akkoord.</p>
            
            <input type="hidden" id="herplanOrderNr">
            
            <label class="block text-sm font-bold text-gray-700 mb-1">Nieuwe Datum *</label>
            <input type="date" id="nieuweDatum" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-3 mb-4 focus:ring-blue-500" required>
            
            <label class="block text-sm font-bold text-gray-700 mb-1">Specifieke Tijd (Optioneel)</label>
            <input type="time" id="nieuweTijd" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-3 mb-6 focus:ring-blue-500">
            
            <div class="flex gap-2">
                <button onclick="sluitHerplanModal()" class="w-1/3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-lg border border-gray-300 transition-colors">Annuleer</button>
                <button onclick="verstuurHerplanning()" class="w-2/3 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition-colors">✅ Verplaats Order</button>
            </div>
        </div>
    </div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbztM02X2Jpd2uzt9sdN2zBbGSIarMgRPI-MvIe0OsvrxY98TZ0ogUbImtQ3ilmQPuM/exec";
    
    let allOrders = [];
    let currentFilter = 'Alles';
    let html5QrcodeScanner = null;
    const urlParams = new URLSearchParams(window.location.search);
    const urlOrderToLoad = urlParams.get('order'); 

    async function loadOrders() {
        try {
            const res = await fetch(WEB_APP_URL + "?action=getOrders");
            allOrders = await res.json();
            document.getElementById('loader').classList.add('hidden');
            if (urlOrderToLoad) document.getElementById('searchInput').value = urlOrderToLoad;
            renderOrders();
        } catch(e) {
            document.getElementById('loader').innerText = "Fout bij inladen. Controleer URL.";
        }
    }

    function setFilter(status) {
        currentFilter = status;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            if (btn.innerText.includes(status) || (status === 'Alles' && btn.innerText === 'Alles Tonen')) {
                btn.className = "filter-btn bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap shadow-sm";
            } else {
                btn.className = "filter-btn bg-gray-100 text-gray-700 hover:bg-gray-200 px-4 py-2 rounded-full text-sm font-bold whitespace-nowrap";
            }
        });
        renderOrders();
    }

    document.getElementById('searchInput').addEventListener('keyup', renderOrders);

    function renderOrders() {
        const container = document.getElementById('order-container'); container.innerHTML = '';
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        let visibleCount = 0;
        allOrders.forEach(order => {
            let matchStatus = false;
            if (currentFilter === 'Alles') matchStatus = true;
            else if (currentFilter === 'Klant Bellen' && order.status.includes('Klant Bellen')) matchStatus = true;
            else if (order.status === currentFilter) matchStatus = true;

            let matchSearch = true;
            if (searchTerm !== "") {
                const textStr = (order.ordernummer + " " + order.naam + " " + order.producten).toLowerCase();
                if (!textStr.includes(searchTerm)) matchSearch = false;
            }

            if (matchStatus && matchSearch && order.status !== "Definitief") {
                visibleCount++; container.appendChild(buildOrderCard(order));
            }
        });
        if (visibleCount === 0) container.innerHTML = `<div class="text-center py-8 text-gray-400 font-bold">Geen openstaande orders.</div>`;
    }

    function buildOrderCard(order) {
        let badgeClass = 'status-wacht';
        if (order.status.includes('Binnen')) badgeClass = 'status-binnen';
        if (order.status.includes('Klant Bellen')) badgeClass = 'status-bellen';
        if (order.status.includes('Deels')) badgeClass = 'status-deels';

        const div = document.createElement('div'); div.className = "bg-white rounded-xl shadow-sm border border-gray-200 p-5";
        div.innerHTML = `
            <div class="flex justify-between items-start mb-2">
                <div>
                    <div class="text-xs text-gray-500 font-bold mb-1">ORD: ${order.ordernummer}</div>
                    <div class="text-lg font-extrabold text-gray-900">${order.naam}</div>
                </div>
                <span class="status-badge ${badgeClass}">${order.status}</span>
            </div>
            <div class="text-sm text-gray-600 mb-4 bg-gray-50 p-3 rounded border border-gray-100">📦 ${order.producten}</div>
            
            <div class="grid grid-cols-2 gap-2 mt-4 pt-4 border-t border-gray-100">
                <button onclick="updateStatus('${order.ordernummer}', 'markPartial')" class="bg-yellow-100 hover:bg-yellow-200 text-yellow-800 py-2 rounded-lg font-bold text-sm">⚠️ Deels</button>
                <button onclick="updateStatus('${order.ordernummer}', 'markBinnen')" class="bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-bold text-sm">✅ Binnen</button>
                
                <button onclick="updateStatus('${order.ordernummer}', 'markGreen')" class="bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-bold text-sm mt-1">🤝 Akkoord</button>
                <button onclick="openHerplanModal('${order.ordernummer}')" class="bg-purple-100 hover:bg-purple-200 text-purple-800 py-2 rounded-lg font-bold text-sm mt-1 border border-purple-200">📅 Herplannen</button>
            </div>
        `; return div;
    }

    async function updateStatus(ordernummer, action) {
        let loc = "";
        if(action === 'markBinnen' || action === 'markPartial') {
            loc = prompt(`Magazijn Locatie (optioneel) voor ORD ${ordernummer}:`);
            if (loc === null) return;
        }
        
        allOrders.forEach(o => {
            if(o.ordernummer === ordernummer) {
                if (action === 'markBinnen') o.status = "Producten Binnen (Klant Bellen)";
                if (action === 'markPartial') o.status = "Deels Binnen";
                if (action === 'markGreen') o.status = "Definitief"; 
            }
        });
        renderOrders();
        await fetch(WEB_APP_URL + "?action=" + action + "&ordernummer=" + ordernummer + "&locatieInfo=" + encodeURIComponent(loc || ""));
    }

    function openHerplanModal(ordernummer) {
        document.getElementById('herplanOrderNr').value = ordernummer;
        document.getElementById('herplanModal').classList.remove('hidden');
    }

    function sluitHerplanModal() {
        document.getElementById('herplanModal').classList.add('hidden');
        document.getElementById('nieuweDatum').value = '';
        document.getElementById('nieuweTijd').value = '';
    }

    async function verstuurHerplanning() {
        const ordernummer = document.getElementById('herplanOrderNr').value;
        const datum = document.getElementById('nieuweDatum').value;
        const tijd = document.getElementById('nieuweTijd').value;
        
        if (!datum) { alert("⚠️ Selecteer a.u.b. een nieuwe datum!"); return; }
        
        sluitHerplanModal();
        allOrders.forEach(o => { if(o.ordernummer === ordernummer) o.status = "Definitief"; });
        renderOrders();
        
        try {
            await fetch(WEB_APP_URL + "?action=herplanDefinitief&ordernummer=" + ordernummer + "&nieuweDatum=" + datum + "&nieuweTijd=" + tijd);
        } catch(e) {
            alert("❌ Fout bij verplaatsen. Controleer netwerkverbinding.");
        }
    }

    function startScanner() {
        document.getElementById('scanner-container').classList.remove('hidden');
        if (!html5QrcodeScanner) html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 100} }, false);
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }
    function stopScanner() { if (html5QrcodeScanner) html5QrcodeScanner.clear(); document.getElementById('scanner-container').classList.add('hidden'); }
    function onScanSuccess(decodedText) { stopScanner(); document.getElementById('searchInput').value = decodedText; setFilter('Alles'); }
    function onScanFailure(error) {}

    loadOrders();
</script>
</body>
</html>
