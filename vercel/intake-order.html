<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sombre Intake - Planner 3.0</title>
    
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/nl.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 550px; margin: 0 auto; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { color: #1a73e8; text-align: center; margin-top: 0; margin-bottom: 20px; }
        
        .scanner-zone { background: #e8f0fe; border: 2px dashed #1a73e8; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 25px; cursor: pointer; position: relative; }
        .scanner-zone input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        
        label { font-size: 13px; font-weight: bold; color: #555; display: block; margin-top: 15px; }
        
        input, select, textarea { 
            width: 100%; height: 50px; font-size: 14px; border: 1px solid #ddd; 
            border-radius: 8px; box-sizing: border-box; padding: 0 12px; 
            background-color: #fff !important; color: #000 !important; margin-top: 5px; 
        }
        select { appearance: auto !important; -webkit-appearance: auto !important; }
        textarea { height: 100px; padding: 12px; resize: none; }
        
        .product-builder { background: #f8f9fa; border: 1px solid #e9ecef; padding: 15px; border-radius: 8px; margin-top: 5px; }
        .product-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
        .btn-remove { background: #ff4d4d; color: white; border: none; border-radius: 6px; width: 35px; height: 50px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        
        .btn-add { background: #e3f2fd; color: #1a73e8; border: 1px dashed #1a73e8; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        .submit-btn { width: 100%; padding: 16px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 25px; transition: 0.3s; }
        .submit-btn:disabled { background: #ccc; }
        
        .time-box { background: #d4edda; color: #155724; padding: 10px; border-radius: 8px; margin-top: 15px; font-weight: bold; text-align: center; border: 1px solid #c3e6cb; }
        
        .flatpickr-calendar { margin: 10px auto; }
        .snel-btn { background: #f0f7ff; color: #1a73e8; border: 1px solid #cce3ff; padding: 8px; border-radius: 6px; font-size: 12px; font-weight: bold; transition: 0.2s; }
        .snel-btn:hover { background: #e1efff; }
    </style>
</head>
<body>

<div class="container">
    <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm mb-5">
        <div class="font-bold text-gray-800">📝 Intake Planner</div>
        <a href="magazijn.html" class="text-blue-600 font-bold text-sm bg-blue-50 px-3 py-1 rounded-lg">Magazijn 📦 ➔</a>
    </div>

    <div class="card">
        <h2>Nieuwe Order Invoeren</h2>
        
        <div class="scanner-zone">
            📸 <strong>Upload Screenshot Leverancier</strong><br>
            <span style="font-size: 12px; color: #666;">Scant automatisch klantgegevens</span>
            <input type="file" id="imageInput" accept="image/*" capture="environment">
            <div id="scannerStatus" class="text-xs mt-2 font-bold text-blue-600"></div>
        </div>

        <form id="orderForm">
            <label>Ordernummer</label>
            <input type="text" name="ordernummer" required>

            <label>Naam Klant</label>
            <input type="text" id="klantNaam" name="naam" required>

            <div class="flex gap-2">
                <div style="flex: 2;"><label>Postcode</label><input type="text" id="pc" name="postcode" required></div>
                <div style="flex: 1;"><label>Huisnr</label><input type="text" id="nr" name="huisnummer" required></div>
            </div>
            
            <label>Straat & Woonplaats</label>
            <input type="text" id="adres" name="straatEnWoonplaats" readonly required>

            <label>Telefoonnummer</label>
            <input type="tel" id="telefoon" name="telefoon" required>

            <label>Producten (Bestellijst)</label>
            <div class="product-builder">
                <div id="productContainer"></div>
                <button type="button" class="btn-add" onclick="voegProductRegelToe()">➕ Extra Product Toevoegen</button>
                <button type="button" class="btn-add" style="background: #fff3e0; color: #e65100; border-color: #e65100;" onclick="voegServiceRegelToe()">🛠️ Service (Vervangen / Terugplaatsen)</button>
            </div>

            <div style="margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 10px;">
                <label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="chkHoogwerker" style="width:auto; margin:0; height:auto;"> 🏗️ Hoogwerker nodig (+60 min)</label>
                <label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="chkExtraTijd" style="width:auto; margin:0; height:auto;"> ⏱️ Extra tijd marge nodig (+60 min)</label>
                <label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="chkDemontage" name="demontage" style="width:auto; margin:0; height:auto;"> ⚠️ Demontage oud product</label>
                <div class="time-box" id="timeDisplay">Berekende Montagetijd: 0 minuten</div>
                <input type="hidden" name="montagetijd_minuten" id="berekendeTijd" value="0">
            </div>

            <div class="mt-6 border-t pt-4">
                <label class="text-blue-700">📅 Gewenste Datum (Override Regio Limiet)</label>
                
                <div class="grid grid-cols-3 gap-2 mt-2">
                    <button type="button" onclick="setIntakeDatum(1)" class="snel-btn">Morgen</button>
                    <button type="button" onclick="setIntakeDatum(7)" class="snel-btn">Volgende week</button>
                    <button type="button" onclick="setIntakeDatum(14)" class="snel-btn">+2 Weken</button>
                </div>

                <div class="mt-3 flex justify-center">
                    <input type="text" id="kalenderInput" name="gewenste_datum" class="hidden">
                </div>
                <div id="kalenderFeedback" class="text-center text-sm font-bold text-green-700 bg-green-100 py-2 mt-2 rounded-lg transition-all opacity-0 hidden"></div>
            </div>

            <label>Voorkeur / Tijdstip</label>
            <div class="flex gap-2">
                <select name="tijd_voorkeur" id="tijd_voorkeur" onchange="toggleTijd()" style="flex: 2;">
                    <option value="Geen">Geen voorkeur (Auto)</option>
                    <option value="Ochtend">☀️ Ochtend</option>
                    <option value="Middag">🌤️ Middag</option>
                    <option value="Vast">⏰ Vaste tijd</option>
                </select>
                <input type="time" name="vaste_tijd" id="vaste_tijd" style="display:none; flex: 1;" title="Vul specifieke tijd in">
            </div>

            <label style="display:flex; align-items:center; gap:8px; margin-top:10px;">
                <input type="checkbox" id="chkSpoed" name="spoed" style="width:auto; height:auto; margin:0;"> 🔥 Spoedklus (Plannen mag vanaf morgen!)
            </label>

            <label>Montage Instructies & Opmerkingen</label>
            <textarea id="opmerkingen" name="opmerkingen" placeholder="Instructies of bijzonderheden..."></textarea>

            <button type="submit" id="submitBtn" class="submit-btn">✅ Opslaan & Plannen</button>
        </form>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbztM02X2Jpd2uzt9sdN2zBbGSIarMgRPI-MvIe0OsvrxY98TZ0ogUbImtQ3ilmQPuM/exec";
    let fp = null;

    // --- KALENDER INITIALISATIE ---
    fp = flatpickr("#kalenderInput", {
        inline: true,
        locale: "nl",
        dateFormat: "d-m-Y", 
        minDate: "today",
        onChange: function(selectedDates, dateStr, instance) {
            if (selectedDates.length > 0) {
                const options = { weekday: 'long', day: 'numeric', month: 'long' };
                const mooieDatum = selectedDates[0].toLocaleDateString('nl-NL', options);
                let feedbackDiv = document.getElementById("kalenderFeedback");
                feedbackDiv.innerText = `✅ Geselecteerd: ${mooieDatum}`;
                feedbackDiv.classList.remove("hidden");
                feedbackDiv.style.opacity = "1"; 
            }
        }
    });

    function setIntakeDatum(dagen) {
        let d = new Date(); d.setDate(d.getDate() + dagen);
        if(fp) fp.setDate(d, true); 
    }

    function toggleTijd() {
        const v = document.getElementById('tijd_voorkeur').value;
        const tijdInput = document.getElementById('vaste_tijd');
        tijdInput.style.display = (v === 'Geen') ? 'none' : 'block';
        tijdInput.required = (v === 'Vast'); 
    }

    // --- PRODUCTEN & UREN CALCULATOR ---
    const productContainer = document.getElementById('productContainer');

    function berekenTijd() {
        let totaalMinuten = 0;
        document.querySelectorAll('.product-row').forEach(regel => {
            const aantal = parseInt(regel.querySelector('.p-aantal')?.value) || 1;
            const type = regel.querySelector('.p-type')?.value || "";
            const bediening = regel.querySelector('.p-bediening')?.value || "";
            let minPerProduct = 0;
            
            if (type === "Zonnescherm") minPerProduct = 120;
            else if (type === "Overkapping") minPerProduct = 480;
            else if (type === "Losse Motor / Onderdeel") minPerProduct = 60;
            else if (type === "Service: Vervangen / Terugplaatsen") minPerProduct = parseInt(bediening) || 0;
            else minPerProduct = (bediening === "Solar") ? 45 : (bediening === "Stroom (230V)" ? 60 : 45);
            
            totaalMinuten += (aantal * minPerProduct);
        });
        if (document.getElementById('chkHoogwerker').checked) totaalMinuten += 60;
        if (document.getElementById('chkExtraTijd').checked) totaalMinuten += 60;
        
        document.getElementById('timeDisplay').innerText = `Berekende Montagetijd: ${totaalMinuten} minuten (${(totaalMinuten/60).toFixed(1)} uur)`;
        document.getElementById('berekendeTijd').value = totaalMinuten;
    }

    function voegProductRegelToe() {
        const div = document.createElement('div'); div.className = 'product-row';
        div.innerHTML = `<input type="number" class="p-aantal" style="width: 70px;" value="1" min="1" required onchange="berekenTijd()">
            <select class="p-type" style="flex: 2;" required onchange="berekenTijd()"><option>Rolluik</option><option>Screen</option><option>Zonnescherm</option><option>Overkapping</option><option>Losse Motor / Onderdeel</option></select>
            <select class="p-bediening" style="flex: 2;" required onchange="berekenTijd()"><option>Solar</option><option>Stroom (230V)</option><option>Handbediend</option><option>N.v.t.</option></select>
            <button type="button" class="btn-remove" onclick="verwijderRegel(this)">✖</button>`;
        productContainer.appendChild(div); berekenTijd();
    }

    function voegServiceRegelToe() {
        const div = document.createElement('div'); div.className = 'product-row';
        div.innerHTML = `<input type="number" class="p-aantal" style="width: 70px;" value="1" min="1" required onchange="berekenTijd()">
            <input type="text" class="p-type" style="flex: 2; background: #e8e8e8 !important; color: #555 !important;" value="Service: Vervangen / Terugplaatsen" readonly required>
            <select class="p-bediening" style="flex: 2;" required onchange="berekenTijd()">
                <option value="15 min">15 minuten</option>
                <option value="30 min">30 minuten</option>
                <option value="45 min">45 minuten</option>
                <option value="60 min">60 minuten</option>
            </select>
            <button type="button" class="btn-remove" onclick="verwijderRegel(this)">✖</button>`;
        productContainer.appendChild(div); berekenTijd();
    }

    function verwijderRegel(btn) { if (productContainer.children.length > 1) { btn.parentElement.remove(); berekenTijd(); } }
    
    voegProductRegelToe(); // Start met 1 lege regel

    document.getElementById('chkHoogwerker').addEventListener('change', berekenTijd); 
    document.getElementById('chkExtraTijd').addEventListener('change', berekenTijd);

    // --- PDOK ADRES ZOEKER ---
    let timeout = null;
    const pcIn = document.getElementById('pc'), nrIn = document.getElementById('nr'), adIn = document.getElementById('adres');

    function zoekAdres() {
        let pc = pcIn.value.replace(/\s+/g, '').toUpperCase();
        let nr = nrIn.value.trim();
        
        if(pc.length === 6 && nr.length >= 1) {
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                let veiligeZoekterm = encodeURIComponent(pc + " " + nr);
                fetch(`https://api.pdok.nl/bzk/locatieserver/search/v3_1/free?q=${veiligeZoekterm}&fq=type:adres`)
                .then(r => r.json())
                .then(d => {
                    if(d.response && d.response.docs && d.response.docs.length > 0) {
                        adIn.value = d.response.docs[0].straatnaam + ", " + d.response.docs[0].woonplaatsnaam;
                        adIn.setAttribute('readonly', true);
                    } else {
                        throw new Error("Niet gevonden");
                    }
                }).catch(() => {
                    adIn.removeAttribute('readonly'); 
                });
            }, 500);
        }
    }
    pcIn.addEventListener('input', zoekAdres); nrIn.addEventListener('input', zoekAdres);

    // --- OCR FOTO SCANNER ---
    document.getElementById('imageInput').addEventListener('change', async function(e) {
        const file = e.target.files[0]; if (!file) return;
        const statusDiv = document.getElementById('scannerStatus'); 
        statusDiv.innerText = "⏳ Foto scannen (Kan even duren)..."; 
        
        try {
            const result = await Tesseract.recognize(file, 'nld'); 
            const ruweTekst = result.data.text;
            let veldenGevonden = 0;

            const instructieMatch = ruweTekst.match(/Montageinstructie[\s\S]*?\n([\s\S]*?)(?=\nJouw klantgegevens|Jouw klantgegevens)/i);
            if (instructieMatch && instructieMatch[1]) { document.getElementById('opmerkingen').value = instructieMatch[1].trim(); veldenGevonden++; }

            const telefoonMatch = ruweTekst.match(/(06[\s-]?[0-9]{8}|0[1-9][0-9]{1,2}[\s-]?[0-9]{6,7})/);
            if (telefoonMatch) { document.getElementById('telefoon').value = telefoonMatch[1].replace(/\s+/g, ''); veldenGevonden++; }

            const pcMatch = ruweTekst.match(/\b([1-9][0-9]{3}\s?[A-Za-z]{2})\b/i);
            if (pcMatch) { document.getElementById('pc').value = pcMatch[1].toUpperCase().replace(/\s+/g, ''); veldenGevonden++; }

            const emailStreetNrMatch = ruweTekst.match(/@[\w\.-]+\.\w+\s+[A-Za-z\s]+\s+([0-9]{1,5}[a-zA-Z]?)/);
            if (emailStreetNrMatch) { document.getElementById('nr').value = emailStreetNrMatch[1]; veldenGevonden++; } 
            else {
                const fallbackNr = ruweTekst.match(/\b([0-9]{1,4}[A-Za-z]?)\s*[\r\n]+\s*[1-9][0-9]{3}\s?[A-Za-z]{2}/);
                if (fallbackNr) { document.getElementById('nr').value = fallbackNr[1]; veldenGevonden++; }
            }

            const naamMatch = ruweTekst.match(/(?:06[\s-]?[0-9]{8}|0[1-9][0-9]{1,2}[\s-]?[0-9]{6,7})\s+([A-Za-z]+)\s+([A-Za-z\s]+)/);
            if (naamMatch && !naamMatch[2].includes("@")) { document.getElementById('klantNaam').value = naamMatch[1] + " " + naamMatch[2].trim(); veldenGevonden++; }

            if (veldenGevonden > 0) {
                statusDiv.innerText = `✅ ${veldenGevonden} velden gevonden! Controleer a.u.b.`; 
                statusDiv.style.color = "green";
                if(document.getElementById('pc').value && document.getElementById('nr').value) zoekAdres();
            } else {
                statusDiv.innerText = "⚠️ Tekst gelezen, maar niets bruikbaars gevonden."; 
                statusDiv.style.color = "#ff3b30";
            }
        } catch (error) { 
            statusDiv.innerText = "❌ Scannen mislukt."; statusDiv.style.color = "red"; 
        }
    });

    // --- FORMULIER VERZENDEN ---
    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn'); 
        btn.disabled = true; 
        btn.innerText = "Bezig met opslaan & plannen...";

        const formData = new FormData(this); 
        let dataObject = Object.fromEntries(formData.entries());
        
        // Fix: Defensieve check op DOM elementen voor de checkboxes
        dataObject.demontage = document.getElementById('chkDemontage')?.checked || false; 
        dataObject.spoed = document.getElementById('chkSpoed')?.checked || false;
        
        let extraOps = [];
        if(document.getElementById('chkHoogwerker')?.checked) extraOps.push("Hoogwerker");
        if(document.getElementById('chkExtraTijd')?.checked) extraOps.push("Extra Tijd");
        if(dataObject.demontage) extraOps.push("Demontage"); // Fix: Demontage netjes toegevoegd aan opmerkingen
        
        let bestaandeOpm = dataObject.opmerkingen || "";
        if(extraOps.length > 0) dataObject.opmerkingen = `[${extraOps.join(' + ')}] ` + bestaandeOpm;

        // Fix: Defensieve chaining (?.) voor product regels
        const regels = document.querySelectorAll('.product-row');
        dataObject.bestellijst = Array.from(regels).map(r => `${r.querySelector('.p-aantal')?.value || 1}x ${r.querySelector('.p-type')?.value || ''} (${r.querySelector('.p-bediening')?.value || ''})`).join(', ');

        // Fix: AbortController toegevoegd tegen oneindig laden
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000); // 15 seconden timeout

        fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(dataObject), signal: controller.signal })
        .then(response => response.text())
        .then(result => { 
            clearTimeout(timeoutId);
            // Fix: trim() toegevoegd voor veiligere vergelijking
            if (result.trim() === "OK") {
                alert("✅ Order succesvol opgeslagen in Google Sheets!"); 
                
                // Fix: Vloeiende reset zonder de pagina hard te herladen
                this.reset();
                if(fp) { fp.clear(); }
                document.getElementById('kalenderFeedback').classList.add("hidden");
                productContainer.innerHTML = '';
                voegProductRegelToe();
                document.getElementById('adres').removeAttribute('readonly');
                document.getElementById('scannerStatus').innerText = "";
            } else if (result.includes("Bestaat al")) {
                alert("⚠️ Let op: Dit ordernummer staat al in de planning!");
            } else {
                alert("❌ Fout van server: " + result);
            }
            btn.disabled = false; btn.innerText = "✅ Opslaan & Plannen"; 
        })
        .catch(err => { 
            clearTimeout(timeoutId);
            if (err.name === 'AbortError') {
                alert("❌ Timeout: De verbinding is te traag. Probeer het opnieuw.");
            } else {
                alert("❌ Fout bij opslaan. Geen internet of toegang geweigerd door Google."); 
            }
            btn.disabled = false; btn.innerText = "✅ Opslaan & Plannen"; 
        });
    });
</script>
</body>
</html>
