<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sombre Intake - Planner</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 550px; }
        
        .nav-bar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .nav-title { font-weight: bold; color: #2c3e50; font-size: 18px; }
        .nav-btn { background: #e8f0fe; color: #1a73e8; text-decoration: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .nav-btn:hover { background: #d2e3fc; }

        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { color: #1a73e8; text-align: center; margin-top: 0; margin-bottom: 20px; }
        
        .scanner-zone { background: #e8f0fe; border: 2px dashed #1a73e8; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 25px; cursor: pointer; position: relative; transition: 0.3s; }
        .scanner-zone:hover { background: #d2e3fc; }
        .scanner-zone input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        #scannerStatus { font-weight: bold; color: #1a73e8; margin-top: 10px; }
        
        label { font-size: 13px; font-weight: bold; color: #555; display: block; margin-top: 15px; }
        input, select, textarea { width: 100%; height: 50px; font-size: 14px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; padding: 0 12px; background: #fff; margin-top: 5px; }
        textarea { height: 100px; padding: 12px; resize: none; }
        .row { display: flex; gap: 10px; }
        #adresStatus { font-size: 11px; margin-top: 5px; font-weight: bold; height: 15px; }
        
        .product-builder { background: #f8f9fa; border: 1px solid #e9ecef; padding: 15px; border-radius: 8px; margin-top: 5px; }
        .product-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
        .p-aantal { width: 70px; }
        .p-type { flex: 2; }
        .p-bediening { flex: 2; }
        .btn-remove { background: #ff4d4d; color: white; border: none; border-radius: 6px; width: 35px; height: 42px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        .btn-add { background: #e3f2fd; color: #1a73e8; border: 1px dashed #1a73e8; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 5px; }

        .time-box { background: #d4edda; color: #155724; padding: 10px; border-radius: 8px; margin-top: 15px; font-weight: bold; text-align: center; border: 1px solid #c3e6cb; }
        
        button.submit-btn { width: 100%; padding: 16px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 25px; transition: 0.3s; }
        button.submit-btn:disabled { background: #ccc; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-bar">
        <div class="nav-title">📝 Intake Planner</div>
        <a href="magazijn" class="nav-btn">Magazijn 📦 ➔</a>
    </div>

    <div class="card">
        <h2>Nieuwe Order Invoeren</h2>
        
        <div class="scanner-zone">
            <span style="font-size: 24px;">📸</span><br>
            <strong>Upload Screenshot Leverancier</strong><br>
            <span style="font-size: 12px; color: #666;">Scant automatisch klantgegevens</span>
            <input type="file" id="imageInput" accept="image/*" capture="environment">
            <div id="scannerStatus"></div>
        </div>

        <form id="orderForm">
            <label>Ordernummer (Zelf invoeren)</label>
            <input type="text" name="ordernummer" required>

            <label>Naam Klant</label>
            <input type="text" id="klantNaam" name="naam" required>

            <div class="row">
                <div style="flex: 2;"><label>Postcode</label><input type="text" id="pc" name="postcode" placeholder="1234 AB" required></div>
                <div style="flex: 1;"><label>Huisnummer</label><input type="text" id="nr" name="huisnummer" required></div>
            </div>
            <div id="adresStatus">Adreszoeker: Wachten op invoer...</div>

            <label>Straat & Woonplaats</label>
            <input type="text" id="adres" name="straatEnWoonplaats" readonly required>

            <label>Telefoonnummer</label>
            <input type="tel" id="telefoon" name="telefoon" required>

            <label>Producten (Bestellijst)</label>
            <div class="product-builder">
                <div id="productContainer"></div>
                <button type="button" class="btn-add" onclick="voegProductRegelToe()">➕ Extra Product Toevoegen</button>
                <button type="button" class="btn-add" style="background: #fff3e0; color: #e65100; border-color: #e65100;" onclick="voegServiceRegelToe()">🛠️ Service (Vervangen / Terugplaatsen) Toevoegen</button>
            </div>

            <div style="margin-top: 15px; border-top: 1px dashed #ccc; padding-top: 10px;">
                <label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="chkHoogwerker" style="width:auto; margin:0; height:auto;"> 🏗️ Hoogwerker nodig (+60 min)</label>
                <label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="chkExtraTijd" style="width:auto; margin:0; height:auto;"> ⏱️ Extra tijd marge nodig (+60 min)</label>
                <label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" name="demontage" style="width:auto; margin:0; height:auto;"> ⚠️ Demontage oud product</label>
                <div class="time-box" id="timeDisplay">Berekende Montagetijd: 0 minuten</div>
                <input type="hidden" name="montagetijd_minuten" id="berekendeTijd" value="0">
            </div>
            
            <label>Gewenste Datum (Override Regio & Max 3 Klussen Limiet)</label>
            <input type="text" name="gewenste_datum" placeholder="Bijv. 01-06-2026 (Leeglaten voor auto-planning)">

            <label>Afwijkende Reistijd (minuten - optioneel)</label>
            <input type="number" name="afwijkende_reistijd" id="afwijkende_reistijd" placeholder="Leeglaten voor automatische regio-reistijd">

            <label>Voorkeur / Tijdstip</label>
            <div class="row">
                <select name="tijd_voorkeur" id="tijd_voorkeur" onchange="toggleTijdVak()" style="flex: 2;">
                    <option value="Geen">Geen voorkeur (Automatisch)</option>
                    <option value="Ochtend">☀️ Ochtend (Bovenaan de dag)</option>
                    <option value="Middag">🌤️ Middag (Onderaan de dag)</option>
                    <option value="Vast">⏰ Vaste tijd (Klant/Kantoor eis)</option>
                </select>
                <input type="time" name="vaste_tijd" id="vaste_tijd" style="display:none; flex: 1; height: 50px;" title="Vul specifieke tijd in (optioneel)">
            </div>

            <label style="display:flex; align-items:center; gap:8px; margin-top:10px;"><input type="checkbox" name="spoed" style="width:auto; margin:0; height:auto;"> 🔥 Spoedklus (Plannen mag vanaf morgen!)</label>

            <label>Montage Instructies & Opmerkingen</label>
            <textarea id="opmerkingen" name="opmerkingen" rows="3" placeholder="Instructies of bijzonderheden..."></textarea>

            <button type="submit" id="submitBtn" class="submit-btn">Opslaan & Plannen</button>
        </form>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbztM02X2Jpd2uzt9sdN2zBbGSIarMgRPI-MvIe0OsvrxY98TZ0ogUbImtQ3ilmQPuM/exec";

    function toggleTijdVak() {
        const voorkeur = document.getElementById('tijd_voorkeur').value;
        const tijdInput = document.getElementById('vaste_tijd');
        if (voorkeur !== 'Geen') {
            tijdInput.style.display = 'block';
            tijdInput.required = (voorkeur === 'Vast'); 
        } else {
            tijdInput.style.display = 'none';
            tijdInput.value = '';
            tijdInput.required = false;
        }
    }

    let timeout = null;
    const pcIn = document.getElementById('pc'), nrIn = document.getElementById('nr'), adIn = document.getElementById('adres'), stIn = document.getElementById('adresStatus');

    function zoekAdres() {
        let pc = pcIn.value.replace(/\s+/g, '').toUpperCase();
        let nr = nrIn.value.trim();
        
        if(pc.length === 6 && nr.length >= 1) {
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                stIn.innerText = "⏳ Zoeken..."; 
                stIn.style.color = "#1a73e8";
                
                // Veilig inpakken van de zoekopdracht zodat spaties (bijv in huisnr 12 A) niet crashen
                let veiligeZoekterm = encodeURIComponent(pc + " " + nr);
                
                fetch(`https://api.pdok.nl/bzk/locatieserver/search/v3_1/free?q=${veiligeZoekterm}&fq=type:adres`)
                .then(r => r.json())
                .then(d => {
                    if(d.response && d.response.docs && d.response.docs.length > 0) {
                        adIn.value = d.response.docs[0].straatnaam + ", " + d.response.docs[0].woonplaatsnaam;
                        stIn.innerText = "✅ Adres Gevonden!"; 
                        stIn.style.color = "green";
                        adIn.setAttribute('readonly', true);
                    } else {
                        throw new Error("Niet gevonden");
                    }
                }).catch((error) => {
                    stIn.innerText = "⚠️ Adres niet gevonden. Vul handmatig in."; 
                    stIn.style.color = "red"; 
                    adIn.removeAttribute('readonly'); // Zorgt dat je toch handmatig kunt typen
                });
            }, 500);
        } else { 
            stIn.innerText = "Adreszoeker: Wachten op complete invoer..."; 
            stIn.style.color = "#888"; 
        }
    }
    pcIn.addEventListener('input', zoekAdres); nrIn.addEventListener('input', zoekAdres);

    document.getElementById('imageInput').addEventListener('change', async function(e) {
        const file = e.target.files[0]; if (!file) return;
        const statusDiv = document.getElementById('scannerStatus'); 
        statusDiv.innerText = "⏳ Foto scannen en ontcijferen (Kan even duren)..."; 
        statusDiv.style.color = "#ff9800";
        
        try {
            const result = await Tesseract.recognize(file, 'nld'); 
            const ruweTekst = result.data.text;
            let veldenGevonden = 0;

            const instructieMatch = ruweTekst.match(/Montageinstructie[\s\S]*?\n([\s\S]*?)(?=\nJouw klantgegevens|Jouw klantgegevens)/i);
            if (instructieMatch && instructieMatch[1]) { 
                document.getElementById('opmerkingen').value = instructieMatch[1].trim(); 
                veldenGevonden++; 
            }

            const telefoonMatch = ruweTekst.match(/(06[\s-]?[0-9]{8}|0[1-9][0-9]{1,2}[\s-]?[0-9]{6,7})/);
            if (telefoonMatch) { 
                document.getElementById('telefoon').value = telefoonMatch[1].replace(/\s+/g, ''); 
                veldenGevonden++; 
            }

            const pcMatch = ruweTekst.match(/\b([1-9][0-9]{3}\s?[A-Za-z]{2})\b/i);
            if (pcMatch) { 
                document.getElementById('pc').value = pcMatch[1].toUpperCase().replace(/\s+/g, ''); 
                veldenGevonden++; 
            }

            const emailStreetNrMatch = ruweTekst.match(/@[\w\.-]+\.\w+\s+[A-Za-z\s]+\s+([0-9]{1,5}[a-zA-Z]?)/);
            if (emailStreetNrMatch) { 
                document.getElementById('nr').value = emailStreetNrMatch[1]; 
                veldenGevonden++; 
            } else {
                const fallbackNr = ruweTekst.match(/\b([0-9]{1,4}[A-Za-z]?)\s*[\r\n]+\s*[1-9][0-9]{3}\s?[A-Za-z]{2}/);
                if (fallbackNr) {
                    document.getElementById('nr').value = fallbackNr[1];
                    veldenGevonden++;
                }
            }

            const naamMatch = ruweTekst.match(/(?:06[\s-]?[0-9]{8}|0[1-9][0-9]{1,2}[\s-]?[0-9]{6,7})\s+([A-Za-z]+)\s+([A-Za-z\s]+)/);
            if (naamMatch && !naamMatch[2].includes("@")) { 
                document.getElementById('klantNaam').value = naamMatch[1] + " " + naamMatch[2].trim(); 
                veldenGevonden++; 
            }

            if (veldenGevonden > 0) {
                statusDiv.innerText = `✅ ${veldenGevonden} velden gevonden en ingevuld! Check of het klopt.`; 
                statusDiv.style.color = "green";
                if(document.getElementById('pc').value && document.getElementById('nr').value) {
                    zoekAdres();
                }
            } else {
                statusDiv.innerText = "⚠️ Tekst wel gelezen, maar de logica niet begrepen. Vul zelf aan."; 
                statusDiv.style.color = "#ff3b30";
            }
            
        } catch (error) { 
            statusDiv.innerText = "❌ Scannen mislukt."; 
            statusDiv.style.color = "red"; 
        }
    });

    const productContainer = document.getElementById('productContainer');
    
    function berekenTijd() {
        let totaalMinuten = 0;
        document.querySelectorAll('.product-row').forEach(regel => {
            const aantal = parseInt(regel.querySelector('.p-aantal').value) || 1;
            const type = regel.querySelector('.p-type').value, bediening = regel.querySelector('.p-bediening').value;
            let minPerProduct = 0;
            
            if (type === "Zonnescherm") minPerProduct = 120;
            else if (type === "Overkapping") minPerProduct = 480;
            else if (type === "Losse Motor / Onderdeel") minPerProduct = 60;
            else if (type === "Service: Vervangen / Terugplaatsen") minPerProduct = parseInt(bediening) || 0;
            else minPerProduct = (bediening === "Solar") ? 45 : (bediening === "Stroom (230V)" ? 60 : 45);
            
            totaalMinuten += (aantal * minPerProduct);
        });
        if (document.getElementById('chkHoogwerker').checked) totaalMinuten += 60;
        if (document.getElementById('chkExtraTijd').checked) totaalMinuten += 60;
        document.getElementById('timeDisplay').innerText = `Berekende Montagetijd: ${totaalMinuten} minuten (${(totaalMinuten/60).toFixed(1)} uur)`;
        document.getElementById('berekendeTijd').value = totaalMinuten;
    }

    function voegProductRegelToe() {
        const div = document.createElement('div'); div.className = 'product-row';
        div.innerHTML = `<input type="number" class="p-aantal" value="1" min="1" required onchange="berekenTijd()">
            <select class="p-type" required onchange="berekenTijd()"><option>Rolluik</option><option>Screen</option><option>Zonnescherm</option><option>Overkapping</option><option>Losse Motor / Onderdeel</option></select>
            <select class="p-bediening" required onchange="berekenTijd()"><option>Solar</option><option>Stroom (230V)</option><option>Handbediend</option><option>N.v.t.</option></select>
            <button type="button" class="btn-remove" onclick="verwijderRegel(this)">✖</button>`;
        productContainer.appendChild(div); berekenTijd();
    }

    function voegServiceRegelToe() {
        const div = document.createElement('div'); div.className = 'product-row';
        div.innerHTML = `<input type="number" class="p-aantal" value="1" min="1" required onchange="berekenTijd()">
            <input type="text" class="p-type" value="Service: Vervangen / Terugplaatsen" readonly required style="flex: 2; background: #e8e8e8; color: #555; border: 1px solid #ddd; outline: none; height: 50px; font-size: 14px; border-radius: 8px; padding: 0 12px; margin-top:5px;">
            <select class="p-bediening" required onchange="berekenTijd()">
                <option value="15 min">15 minuten</option>
                <option value="30 min">30 minuten</option>
                <option value="45 min">45 minuten</option>
                <option value="60 min">60 minuten</option>
            </select>
            <button type="button" class="btn-remove" onclick="verwijderRegel(this)">✖</button>`;
        productContainer.appendChild(div); berekenTijd();
    }

    function verwijderRegel(btn) { if (productContainer.children.length > 1) { btn.parentElement.remove(); berekenTijd(); } }
    document.getElementById('chkHoogwerker').addEventListener('change', berekenTijd); document.getElementById('chkExtraTijd').addEventListener('change', berekenTijd);
    
    // Direct eerste regel laden bij opstarten
    voegProductRegelToe();

    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn'); 
        btn.disabled = true; 
        btn.innerText = "Bezig met plannen...";

        const formData = new FormData(this); 
        let dataObject = Object.fromEntries(formData.entries());
        dataObject.demontage = formData.get('demontage') === 'on'; 
        dataObject.spoed = formData.get('spoed') === 'on';
        
        let extraOps = [];
        if(document.getElementById('chkHoogwerker').checked) extraOps.push("Hoogwerker");
        if(document.getElementById('chkExtraTijd').checked) extraOps.push("Extra Tijd");
        
        // Zorg dat we de opmerkingen niet overschrijven maar aanvullen
        let bestaandeOpm = dataObject.opmerkingen || "";
        if(extraOps.length > 0) {
            dataObject.opmerkingen = `[${extraOps.join(' + ')}] ` + bestaandeOpm;
        }

        const regels = document.querySelectorAll('.product-row');
        dataObject.bestellijst = Array.from(regels).map(r => {
            const aantal = r.querySelector('.p-aantal').value;
            const type = r.querySelector('.p-type').value;
            const bediening = r.querySelector('.p-bediening').value;
            return `${aantal}x ${type} (${bediening})`;
        }).join(', ');

        // Veilig verzenden zonder 'no-cors' en met foutafhandeling
        fetch(SCRIPT_URL, { 
            method: 'POST', 
            body: JSON.stringify(dataObject) 
        })
        .then(response => response.text())
        .then(result => { 
            if (result === "OK") {
                alert("✅ Order succesvol opgeslagen in Google Sheets!"); 
                this.reset(); 
                productContainer.innerHTML = ""; 
                voegProductRegelToe(); 
                toggleTijdVak();
                document.getElementById('adres').setAttribute('readonly', true); 
                document.getElementById('adresStatus').innerText = "Wachten op invoer...";
            } else if (result.includes("Bestaat al")) {
                alert("⚠️ Let op: Dit ordernummer staat al in de planning!");
            } else {
                alert("❌ Fout van server: " + result);
            }
            btn.disabled = false; 
            btn.innerText = "Opslaan & Plannen"; 
        })
        .catch(err => { 
            alert("❌ Fout bij opslaan. Geen internet of toegang geweigerd door Google."); 
            btn.disabled = false; 
            btn.innerText = "Opslaan & Plannen"; 
        });
    });
</script>
</body>
</html>
