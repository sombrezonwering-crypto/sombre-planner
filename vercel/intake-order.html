<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Order Intake Enterprise | Sombre Planner Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hidden { display: none !important; }
        .transition-bg { transition: background-color 0.5s ease, border-color 0.5s ease; }
        .checkbox-card { cursor: pointer; transition: all 0.2s ease; border: 2px solid transparent; }
        .checkbox-card:hover { border-color: #bfdbfe; background-color: #f8fafc; }
        .checkbox-card:has(input:checked) { background-color: #eff6ff; border-color: #3b82f6; box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06); }
        .input-focus { transition: all 0.2s; }
        .input-focus:focus { transform: translateY(-1px); box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3); border-color: #3b82f6; outline: none; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-3xl mx-auto mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="text-center md:text-left">
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">Nieuwe Order</h1>
            <p class="text-gray-500 font-medium mt-1">Sombre ERP Intake Module V11.4</p>
        </div>
        <a href="magazijn.html" class="bg-gray-800 hover:bg-black text-white font-bold py-2.5 px-5 rounded-xl transition-all text-sm shadow-lg flex items-center gap-2 transform hover:-translate-y-0.5">
            📦 Open Magazijn App ➡️
        </a>
    </div>

    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl p-6 md:p-8 border border-gray-100 mb-10">
        <form id="orderForm" class="space-y-8">

            <div class="bg-gray-50 p-5 rounded-xl border border-gray-200">
                <label class="block text-sm font-bold text-gray-800 mb-3 uppercase tracking-wide">1. Type Order & Afdeling</label>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" id="btnMontage" class="type-btn font-bold py-3 rounded-xl border-2 transition-all text-sm flex items-center justify-center gap-2">🏗️ Montage</button>
                        <button type="button" id="btnService" class="type-btn font-bold py-3 rounded-xl border-2 transition-all text-sm flex items-center justify-center gap-2">🛠️ Service</button>
                    </div>
                    <div>
                        <select id="afdelingSource" class="w-full bg-white border-2 border-gray-200 rounded-xl p-3 text-sm font-bold text-gray-800 focus:border-blue-500 shadow-sm input-focus h-full">
                            <option value="Sombre-zonwering">🏢 Sombre-zonwering</option>
                            <option value="Zonweringfabriek">🏢 Zonweringfabriek</option>
                            <option value="Degalux online">🏢 Degalux online</option>
                            <option value="Dupro-Kozijnen">🏢 Dupro-Kozijnen</option>
                            <option value="Elite-Gordijn">🏢 Elite-Gordijn</option>
                        </select>
                    </div>
                </div>
            </div>

            <div>
                <h3 class="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2 border-b pb-2">👤 Klant & Locatie</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wide" id="ordernummerLabel">Ordernummer *</label>
                        <input type="text" id="ordernummer" required placeholder="Bijv. SO-2026-01" class="input-focus w-full md:w-1/2 bg-gray-50 border border-gray-300 rounded-xl p-3 text-sm font-mono uppercase">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wide">Naam Klant *</label>
                        <input type="text" id="naam" required class="input-focus w-full bg-gray-50 border border-gray-300 rounded-xl p-3 text-sm">
                    </div>
                    <div class="grid grid-cols-3 gap-3 md:col-span-2">
                        <div class="col-span-2">
                            <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wide">Postcode</label>
                            <input type="text" id="postcode" placeholder="1312 AB" class="adres-trigger input-focus w-full bg-gray-50 border border-gray-300 rounded-xl p-3 text-sm uppercase">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wide">Huisnr *</label>
                            <input type="text" id="huisnummer" required class="adres-trigger input-focus w-full bg-gray-50 border border-gray-300 rounded-xl p-3 text-sm">
                        </div>
                    </div>
                    <div class="md:col-span-2">
                        <div class="flex justify-between items-center mb-1.5">
                            <label class="block text-xs font-bold text-gray-700 uppercase tracking-wide">Straat & Woonplaats *</label>
                            <span id="validationBadge" class="text-[10px] font-bold text-gray-400 bg-gray-200 px-2 py-0.5 rounded transition-all">Niet geverifieerd</span>
                        </div>
                        <input type="text" id="straatEnWoonplaats" required placeholder="Bijv. Kerkstraat 12, Almere" class="adres-trigger transition-bg input-focus w-full bg-gray-50 border border-gray-300 rounded-xl p-3 text-sm font-medium text-gray-900">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wide">Telefoonnummer *</label>
                        <input type="tel" id="telefoon" required placeholder="Bijv. 06 12345678" class="input-focus w-full md:w-1/2 bg-gray-50 border border-gray-300 rounded-xl p-3 text-sm">
                    </div>
                </div>
            </div>

            <div id="montageSectie" class="bg-white rounded-xl">
                <h3 class="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2 border-b pb-2">📦 Montage Calculator</h3>
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 mb-5">
                    <label class="block text-sm font-bold text-gray-800 mb-3">🛠️ Montageproducten Toevoegen</label>
                    <div id="montageTakenContainer" class="space-y-3 mb-4"></div>
                    <button type="button" id="btnAddMontage" class="w-full bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-3 rounded-xl border border-blue-200 text-sm transition-colors flex items-center justify-center gap-2">
                        <span class="text-lg leading-none">+</span> Extra product toevoegen
                    </button>
                </div>
                <div class="bg-gradient-to-r from-blue-50 to-blue-100 border border-blue-200 rounded-xl p-4 flex justify-between items-center mb-5 shadow-sm">
                    <span class="text-sm font-bold text-blue-900 uppercase tracking-wide">Berekende Montagetijd:</span>
                    <span id="displayMontageTijd" class="text-2xl font-black text-blue-700">0 min</span>
                </div>
                <textarea id="opmerkingenMontage" rows="3" placeholder="Bijzonderheden, kleur, afmetingen..." class="input-focus w-full bg-gray-50 border border-gray-300 rounded-xl p-3 text-sm"></textarea>
            </div>

            <div id="serviceSectie" class="hidden bg-white rounded-xl">
                <h3 class="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2 border-b pb-2">🛠️ Service Details</h3>
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 mb-5">
                    <label class="block text-sm font-bold text-gray-800 mb-3">🔧 Service Taken</label>
                    <div id="serviceTakenContainer" class="space-y-3 mb-4"></div>
                    <button type="button" id="btnAddService" class="w-full bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-3 rounded-xl border border-blue-200 text-sm transition-colors flex items-center justify-center gap-2">
                        <span class="text-lg leading-none">+</span> Extra servicetaak toevoegen
                    </button>
                </div>
                <div class="bg-gradient-to-r from-indigo-50 to-indigo-100 border border-indigo-200 rounded-xl p-4 flex justify-between items-center mb-5 shadow-sm">
                    <span class="text-sm font-bold text-indigo-900 uppercase tracking-wide">Berekende Servicetijd:</span>
                    <span id="displayServiceTijd" class="text-2xl font-black text-indigo-700">0 min</span>
                </div>
                <textarea id="klachtService" rows="3" placeholder="Klachtomschrijving & Onderdelen..." class="input-focus w-full bg-gray-50 border border-gray-300 rounded-xl p-3 text-sm"></textarea>
            </div>

            <hr class="border-gray-200">

            <div>
                <h3 class="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2 border-b pb-2">🚧 Hulpmiddelen & Vereisten</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <label class="checkbox-card flex items-center bg-white p-4 rounded-xl border-2 border-gray-200 shadow-sm">
                        <input id="reqHoogwerker" type="checkbox" class="modifier-trigger w-5 h-5 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500">
                        <span class="ml-3 text-sm font-bold text-gray-800">🏗️ Hoogwerker Nodig (+60m)</span>
                    </label>
                    <label class="checkbox-card flex items-center bg-white p-4 rounded-xl border-2 border-gray-200 shadow-sm">
                        <input id="reqSteiger" type="checkbox" class="modifier-trigger w-5 h-5 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500">
                        <span class="ml-3 text-sm font-bold text-gray-800">🪜 Steiger Nodig (+60m)</span>
                    </label>
                    <label class="checkbox-card flex items-center bg-white p-4 rounded-xl border-2 border-gray-200 shadow-sm">
                        <input id="reqExtraMan" type="checkbox" class="modifier-trigger w-5 h-5 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500">
                        <span class="ml-3 text-sm font-bold text-gray-800">💪 Extra Monteur (+30m)</span>
                    </label>
                    <label class="checkbox-card flex items-center bg-white p-4 rounded-xl border-2 border-gray-200 shadow-sm">
                        <input id="demontage" type="checkbox" class="modifier-trigger w-5 h-5 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500">
                        <span class="ml-3 text-sm font-bold text-gray-800">🔨 Demontage Oud (+60m)</span>
                    </label>
                </div>

                <div class="md:col-span-2 mt-4 bg-white p-4 rounded-xl border-2 border-gray-200 shadow-sm">
                    <label class="block text-xs font-bold text-gray-700 mb-2 uppercase tracking-wide">Lange ladder mee?</label>
                    <select id="langeLadder" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-3 text-sm font-medium focus:border-blue-500 transition-colors">
                        <option value="Geen">Geen</option>
                        <option value="1 stuk">1 stuk</option>
                        <option value="2 stuks">2 stuks</option>
                    </select>
                </div>
            </div>

            <hr class="border-gray-200">

            <div>
                <h3 class="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2 border-b pb-2">📅 Planning & Rittijd</h3>
                <label class="flex items-center mb-5 bg-red-50 p-4 rounded-xl border-2 border-red-200 cursor-pointer hover:bg-red-100 transition-colors shadow-sm">
                    <input id="spoed" type="checkbox" class="w-6 h-6 text-red-600 bg-white border-gray-300 rounded">
                    <span class="ml-3 text-base font-black text-red-700 tracking-wide uppercase">🔥 Dit is een SPOED opdracht</span>
                </label>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wide">Gewenste Datum (Optioneel)</label>
                        <input type="date" id="gewensteDatum" class="input-focus w-full bg-gray-50 border border-gray-300 rounded-xl p-3 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wide">Tijd Voorkeur</label>
                        <select id="tijdVoorkeur" class="input-focus w-full bg-gray-50 border border-gray-300 rounded-xl p-3 text-sm font-medium">
                            <option value="Geen">Geen specifieke voorkeur</option>
                            <option value="Ochtend">Ochtend</option>
                            <option value="Middag">Middag</option>
                            <option value="Vast">Vaste tijd</option>
                        </select>
                    </div>
                    <div id="vasteTijdContainer" class="hidden md:col-span-2 bg-blue-50 p-4 rounded-xl border border-blue-200">
                        <label class="block text-xs font-bold text-blue-900 mb-1.5 uppercase tracking-wide">Specifieke Tijd *</label>
                        <input type="time" id="vasteTijd" class="input-focus w-full bg-white border border-blue-300 rounded-xl p-3 text-sm text-blue-900 font-bold">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-gray-700 mb-1.5 uppercase tracking-wide">Afwijkende Reistijd (Optioneel, min.)</label>
                        <input type="number" id="afwijkendeReistijd" min="0" max="300" placeholder="Overschrijft regio reistijd" class="input-focus w-full bg-gray-50 border border-gray-300 rounded-xl p-3 text-sm font-bold">
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-extrabold rounded-2xl text-xl px-5 py-4 shadow-xl transform transition-all hover:-translate-y-1 mt-6">
                🚀 Order Opslaan & Inplannen
            </button>
        </form>

        <div id="successMsg" class="hidden mt-8 bg-green-50 border-2 border-green-400 p-8 rounded-2xl text-center shadow-lg">
            <div class="text-5xl mb-4">✅</div>
            <h3 class="text-2xl font-black text-green-800 mb-2">Order Succesvol Opgeslagen!</h3>
            <button onclick="location.reload()" class="inline-block bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-xl mt-4">Nieuwe Order Invoeren</button>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const APP_CONFIG = {
            // FIX: De actuele, correcte URL ingevuld (exact gelijk aan de Magazijn App!)
            WEB_APP_URL: "https://script.google.com/macros/s/AKfycbw8XNAycvrJWLnKYxP5ulFmbCZUrLNtb0Etc9-HteUcsdtLU9P90QiKhqumPaKxaqc/exec",
            FETCH_TIMEOUT_MS: 40000,
            TIMES: {
                PRODUCT: { knikarm: 60, screen: 45, rolluik: 45, uitval: 60, markies: 60, hor: 15, overkapping: 480, veranda: 480, overig: 30 },
                SERVICE: { motor_stroom: 45, motor_solar: 30, motor_hand: 60, doek: 60, lamellen: 45, armen: 60, inregelen: 30 },
                MODIFIERS: { hoogwerker: 60, steiger: 60, demontage: 60, extraMonteur: 30 },
                BEDIENING: { solar: 0, afstandsbediening: 15, schakelaar: 30, handbediend: 30 },
                ONDERGROND: { kozijn: 0, muur: 15 }
            }
        };

        // --- 2. STATE ---
        const AppState = {
            isServiceMode: false,
            totalTime: 0,
            isSubmitting: false,
            addressCache: {},
            lastQuery: ""
        };

        // --- 3. INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('btnMontage').addEventListener('click', () => setMode(false));
            document.getElementById('btnService').addEventListener('click', () => setMode(true));
            document.getElementById('btnAddMontage').addEventListener('click', renderMontageRow);
            document.getElementById('btnAddService').addEventListener('click', renderServiceRow);
            
            document.getElementById('tijdVoorkeur').addEventListener('change', handleTijdVoorkeurChange);
            document.querySelectorAll('.adres-trigger').forEach(el => el.addEventListener('blur', processAddressInput));
            document.querySelectorAll('.modifier-trigger').forEach(el => el.addEventListener('change', updateTotals));
            document.getElementById('orderForm').addEventListener('submit', handleFormSubmit);

            setMode(false);
        });

        // --- 4. UI LOGIC ---
        function setMode(toService) {
            AppState.isServiceMode = toService;
            const btnMnt = document.getElementById('btnMontage');
            const btnSrv = document.getElementById('btnService');
            const activeCls = "bg-blue-50 border-blue-400 text-blue-700 shadow-md";
            const inactiveCls = "bg-white border-gray-200 text-gray-500 hover:bg-gray-50";

            if (AppState.isServiceMode) {
                btnSrv.className = `type-btn font-bold py-3 rounded-xl border-2 transition-all text-sm flex items-center justify-center gap-2 ${activeCls}`;
                btnMnt.className = `type-btn font-bold py-3 rounded-xl border-2 transition-all text-sm flex items-center justify-center gap-2 ${inactiveCls}`;
                document.getElementById('ordernummerLabel').innerText = "Notion Ordernummer *";
                document.getElementById('serviceSectie').classList.remove('hidden');
                document.getElementById('montageSectie').classList.add('hidden');
                document.getElementById('klachtService').required = true;
                if (document.querySelectorAll('.service-task').length === 0) renderServiceRow();
            } else {
                btnMnt.className = `type-btn font-bold py-3 rounded-xl border-2 transition-all text-sm flex items-center justify-center gap-2 ${activeCls}`;
                btnSrv.className = `type-btn font-bold py-3 rounded-xl border-2 transition-all text-sm flex items-center justify-center gap-2 ${inactiveCls}`;
                document.getElementById('ordernummerLabel').innerText = "Ordernummer *";
                document.getElementById('montageSectie').classList.remove('hidden');
                document.getElementById('serviceSectie').classList.add('hidden');
                document.getElementById('klachtService').required = false;
                if (document.querySelectorAll('.montage-task').length === 0) renderMontageRow();
            }
            updateTotals();
        }

        function handleTijdVoorkeurChange(e) {
            const vastContainer = document.getElementById('vasteTijdContainer');
            const vastInput = document.getElementById('vasteTijd');
            if (e.target.value === 'Vast') {
                vastContainer.classList.remove('hidden');
                vastInput.required = true;
            } else {
                vastContainer.classList.add('hidden');
                vastInput.value = '';
                vastInput.required = false;
            }
        }

        function toggleCustomWork(e, row) {
            const customContainer = row.querySelector('.custom-werk-container');
            const prodCol = row.querySelector('.srvProductCol');
            const voedingCol = row.querySelector('.srvVoedingCol');
            
            if (e.target.value === 'ander_werk') {
                customContainer.classList.remove('hidden');
                prodCol.classList.add('hidden');
                voedingCol.classList.add('hidden');
            } else {
                customContainer.classList.add('hidden');
                prodCol.classList.remove('hidden');
                voedingCol.classList.remove('hidden');
            }
        }

        // --- 5. DOM BUILDERS ---
        function renderMontageRow() {
            const container = document.getElementById('montageTakenContainer');
            const row = document.createElement('div');
            row.className = "montage-task bg-white border border-gray-200 p-3 rounded-xl shadow-sm grid grid-cols-1 md:grid-cols-5 gap-3 items-end mt-3";
            row.innerHTML = `
                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-gray-500 mb-1">Product</label>
                    <select class="mntProduct trigger-calc w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm font-medium input-focus">
                        <option value="knikarm">Knikarmscherm</option>
                        <option value="screen">Screen</option>
                        <option value="rolluik">Rolluik</option>
                        <option value="uitval">Uitvalscherm</option>
                        <option value="markies">Markies</option>
                        <option value="hor">Horren</option>
                        <option value="overkapping">Overkapping</option>
                        <option value="veranda">Veranda</option>
                        <option value="overig">Overig</option>
                    </select>
                </div>
                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-gray-500 mb-1">Ondergrond</label>
                    <select class="mntOndergrond trigger-calc w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm font-medium input-focus">
                        <option value="kozijn">Kozijn</option>
                        <option value="muur">Muur (+15m)</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-gray-500 mb-1">Bediening</label>
                    <select class="mntBediening trigger-calc w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm font-medium input-focus">
                        <option value="solar">Solar (Geen boren)</option>
                        <option value="afstandsbediening">Afstandsbediening (+15m)</option>
                        <option value="schakelaar">Schakelaar (+30m)</option>
                        <option value="handbediend">Handbediend (Band) (+30m)</option>
                    </select>
                </div>
                <div class="flex gap-2 md:col-span-1">
                    <div class="w-1/2">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Aantal</label>
                        <input type="number" value="1" min="1" class="mntAantal trigger-calc w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm text-center font-bold input-focus">
                    </div>
                    <button type="button" class="del-btn w-1/2 mt-5 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg border border-red-200 font-bold text-sm">X</button>
                </div>
            `;
            bindRowEvents(row, '.montage-task');
            container.appendChild(row);
            updateTotals();
        }

        function renderServiceRow() {
            const container = document.getElementById('serviceTakenContainer');
            const row = document.createElement('div');
            row.className = "service-task bg-white border border-gray-200 p-3 rounded-xl shadow-sm grid grid-cols-1 md:grid-cols-4 gap-3 items-end mt-3";
            row.innerHTML = `
                <div class="md:col-span-1">
                    <label class="block text-xs font-bold text-gray-500 mb-1">Type Klus</label>
                    <select class="srvType trigger-calc w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm font-medium input-focus">
                        <option value="motor">Motor</option>
                        <option value="doek">Doek</option>
                        <option value="lamellen">Lamellen</option>
                        <option value="armen">Armen</option>
                        <option value="inregelen">Inregelen</option>
                        <option value="ander_werk">Andere werkzaamheden...</option>
                    </select>
                </div>
                <div class="md:col-span-1 srvProductCol">
                    <label class="block text-xs font-bold text-gray-500 mb-1">Product</label>
                    <select class="srvProduct trigger-calc w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm font-medium input-focus">
                        <option value="screen_rolluik">Screen / Rolluik</option>
                        <option value="zonnescherm">Zonnescherm</option>
                        <option value="uitvalscherm">Uitvalscherm</option>
                        <option value="nvt">N.v.t. / Overig</option>
                    </select>
                </div>
                <div class="md:col-span-1 srvVoedingCol">
                    <label class="block text-xs font-bold text-gray-500 mb-1">Voeding/Details</label>
                    <select class="srvVoeding trigger-calc w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm font-medium input-focus">
                        <option value="stroom">230V / Standaard</option>
                        <option value="solar">Solar</option>
                        <option value="hand">Handbediend</option>
                    </select>
                </div>
                <div class="flex gap-2 md:col-span-1">
                    <div class="w-2/3">
                        <label class="block text-xs font-bold text-gray-500 mb-1">Aantal</label>
                        <input type="number" value="1" min="1" class="srvAantal trigger-calc w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm text-center font-bold input-focus">
                    </div>
                    <button type="button" class="del-btn w-1/3 mt-5 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg border border-red-200 font-bold text-sm">X</button>
                </div>
                
                <div class="custom-werk-container hidden md:col-span-4 bg-indigo-50 p-3 rounded-lg border border-indigo-100 mt-2 grid grid-cols-1 md:grid-cols-4 gap-3">
                    <div class="md:col-span-3">
                        <label class="block text-xs font-bold text-indigo-700 mb-1">Beschrijf werkzaamheden</label>
                        <input type="text" class="srvCustomDesc w-full bg-white border border-indigo-200 rounded-lg p-2.5 text-sm input-focus" placeholder="Bijv. bandopvinder vervangen of profiel kitten...">
                    </div>
                    <div class="md:col-span-1">
                        <label class="block text-xs font-bold text-indigo-700 mb-1">Tijd (min per stuk)</label>
                        <input type="number" value="30" min="0" class="srvCustomTime trigger-calc w-full bg-white border border-indigo-200 rounded-lg p-2.5 text-sm text-center font-bold input-focus">
                    </div>
                </div>
            `;
            
            row.querySelector('.srvType').addEventListener('change', (e) => toggleCustomWork(e, row));
            bindRowEvents(row, '.service-task');
            container.appendChild(row);
            updateTotals();
        }

        function bindRowEvents(row, rowSelector) {
            row.querySelectorAll('.trigger-calc').forEach(el => {
                el.addEventListener('change', updateTotals);
                el.addEventListener('keyup', updateTotals);
            });
            row.querySelector('.del-btn').addEventListener('click', () => {
                if (document.querySelectorAll(rowSelector).length > 1) { row.remove(); updateTotals(); }
                else { alert("⚠️ Er is minimaal 1 item verplicht."); }
            });
        }

        // --- 6. CALCULATIONS ---
        function updateTotals() {
            AppState.totalTime = AppState.isServiceMode ? calcService() : calcMontage();
            if (AppState.isServiceMode) document.getElementById('displayServiceTijd').innerText = AppState.totalTime + " min";
            else document.getElementById('displayMontageTijd').innerText = AppState.totalTime + " min";
        }

        function calcMontage() {
            let total = 0;
            document.querySelectorAll('.montage-task').forEach(taak => {
                const prodVal = taak.querySelector('.mntProduct').value;
                const ondVal = taak.querySelector('.mntOndergrond').value;
                const bedVal = taak.querySelector('.mntBediening').value;
                const aantal = parseInt(taak.querySelector('.mntAantal').value) || 1;
                
                let baseTime = APP_CONFIG.TIMES.PRODUCT[prodVal] || 30;
                let ondExtra = APP_CONFIG.TIMES.ONDERGROND[ondVal] || 0;
                let bedExtra = APP_CONFIG.TIMES.BEDIENING[bedVal] || 0;
                
                total += ((baseTime + ondExtra + bedExtra) * aantal);
            });
            return addModifiers(total);
        }

        function calcService() {
            let total = 0;
            document.querySelectorAll('.service-task').forEach(taak => {
                const type = taak.querySelector('.srvType').value;
                const voeding = taak.querySelector('.srvVoeding').value;
                const aantal = parseInt(taak.querySelector('.srvAantal').value) || 1;
                let baseTime = 30;
                
                if (type === 'motor') baseTime = APP_CONFIG.TIMES.SERVICE[`motor_${voeding}`] || 45;
                else if (type === 'ander_werk') baseTime = parseInt(taak.querySelector('.srvCustomTime').value) || 0;
                else baseTime = APP_CONFIG.TIMES.SERVICE[type] || 30;

                total += (baseTime * aantal);
            });
            return addModifiers(total);
        }

        function addModifiers(total) {
            if (document.getElementById('reqSteiger').checked) total += APP_CONFIG.TIMES.MODIFIERS.steiger;
            if (document.getElementById('reqHoogwerker').checked) total += APP_CONFIG.TIMES.MODIFIERS.hoogwerker;
            if (document.getElementById('demontage').checked) total += APP_CONFIG.TIMES.MODIFIERS.demontage;
            if (document.getElementById('reqExtraMan').checked) total += APP_CONFIG.TIMES.MODIFIERS.extraMonteur;
            return total;
        }

        // --- 7. PDOK ADDRESS VALIDATION ---
        async function processAddressInput() {
            const pcField = document.getElementById('postcode');
            const hnField = document.getElementById('huisnummer');
            const straatField = document.getElementById('straatEnWoonplaats');
            
            const pc = pcField.value.trim().replace(/\s+/g, '').toUpperCase();
            const hn = hnField.value.trim();
            const straat = straatField.value.trim();

            if (pc.length === 6 && hn.length >= 1) {
                const query = `FWD-${pc}-${hn}`;
                if (AppState.lastQuery === query) return;
                AppState.lastQuery = query;
                
                if (AppState.addressCache[query]) return applyResult(AppState.addressCache[query]);

                try {
                    const res = await fetch(`https://api.pdok.nl/bzk/locatieserver/search/v3_1/free?fq=postcode:${pc}&fq=huisnummer:${hn}&rows=1`);
                    const data = await res.json();
                    if (data.response.docs.length > 0) {
                        const doc = data.response.docs[0];
                        const result = { success: true, straat: `${doc.straatnaam} ${hn}, ${doc.woonplaatsnaam}`, msg: "Geverifieerd via PC" };
                        AppState.addressCache[query] = result; applyResult(result);
                    } else applyResult({ success: false, msg: "Adres onbekend" });
                } catch (e) { console.error("PDOK Error:", e); }
            }
            else if (pc.length === 0 && hn.length >= 1 && straat.length >= 5) {
                const query = `REV-${hn}-${straat}`;
                if (AppState.lastQuery === query) return;
                AppState.lastQuery = query;
                
                if (AppState.addressCache[query]) return applyResult(AppState.addressCache[query]);

                try {
                    const cleanStraat = straat.replace(/,/g, '');
                    const res = await fetch(`https://api.pdok.nl/bzk/locatieserver/search/v3_1/free?q=${encodeURIComponent(cleanStraat + " " + hn)}&rows=1`);
                    const data = await res.json();
                    
                    if (data.response.docs.length > 0) {
                        const doc = data.response.docs[0];
                        if (doc.postcode) {
                            const formattedPc = doc.postcode.substring(0, 4) + " " + doc.postcode.substring(4);
                            const result = { success: true, postcode: formattedPc, straat: `${doc.straatnaam} ${hn}, ${doc.woonplaatsnaam}`, msg: "Postcode gevonden" };
                            AppState.addressCache[query] = result; applyResult(result);
                        }
                    } else applyResult({ success: false, msg: "Postcode niet gevonden" });
                } catch (e) { console.error("PDOK Error:", e); }
            }
        }

        function applyResult(res) {
            const straatField = document.getElementById('straatEnWoonplaats');
            const pcField = document.getElementById('postcode');
            const badge = document.getElementById('validationBadge');
            
            badge.innerText = res.msg;
            if (res.success) {
                if (res.straat) straatField.value = res.straat;
                if (res.postcode) pcField.value = res.postcode;
                straatField.classList.add('bg-green-50', 'border-green-400');
                badge.className = "text-[10px] font-bold text-green-700 bg-green-100 px-2 py-0.5 rounded transition-all";
            } else {
                straatField.classList.remove('bg-green-50', 'border-green-400');
                badge.className = "text-[10px] font-bold text-red-700 bg-red-100 px-2 py-0.5 rounded transition-all";
            }
        }

        // --- 8. SUBMISSION LOGIC ---
        async function handleFormSubmit(e) {
            e.preventDefault();
            if (AppState.isSubmitting) return;

            // Basic Validation
            const telefoon = document.getElementById('telefoon').value.trim();
            if (!/^[\d\s+\-()]{8,20}$/.test(telefoon)) return alert("⚠️ Ongeldig telefoonnummer.");
            
            const postcode = document.getElementById('postcode').value.trim();
            if (postcode === "" && document.getElementById('straatEnWoonplaats').value !== "") {
                return alert("⚠️ De postcode wordt nog opgevraagd bij het Kadaster. Klik buiten het veld en probeer het opnieuw.");
            }
            if (!/^[1-9][0-9]{3}\s?[A-Za-z]{2}$/i.test(postcode)) return alert("⚠️ Ongeldig postcode formaat.");
            
            const huisnummer = document.getElementById('huisnummer').value.trim();
            if (!/^[1-9]\d*[A-Za-z0-9\-\s]*$/.test(huisnummer)) return alert("⚠️ Ongeldig huisnummer.");
            
            if (document.getElementById('tijdVoorkeur').value === 'Vast' && !document.getElementById('vasteTijd').value) {
                return alert("⚠️ Vul de specifieke Vaste Tijd in.");
            }

            // Cleanup address string
            let netAdres = document.getElementById('straatEnWoonplaats').value.trim();
            if (huisnummer && netAdres.endsWith(huisnummer)) {
                netAdres = netAdres.slice(0, -huisnummer.length).trim();
            }

            // UI State updates
            AppState.isSubmitting = true;
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = "⏳ Order wordt verwerkt...";
            btn.disabled = true;
            btn.classList.replace("bg-blue-600", "bg-gray-400");
            btn.classList.replace("hover:-translate-y-1", "opacity-75");

            // Compile Payload
            let jsonBestellijst = [];
            if (AppState.isServiceMode) {
                document.querySelectorAll('.service-task').forEach(t => {
                    let typeKey = t.querySelector('.srvType').value;
                    let typeText = t.querySelector('.srvType').options[t.querySelector('.srvType').selectedIndex].text;
                    let detailsText = t.querySelector('.srvVoeding').options[t.querySelector('.srvVoeding').selectedIndex].text;
                    
                    if (typeKey === 'ander_werk') {
                        typeText = "Ander werk: " + (t.querySelector('.srvCustomDesc').value || "Niet gespecificeerd");
                        detailsText = "N.v.t.";
                    }
                    jsonBestellijst.push({ type: typeText, details: detailsText, aantal: parseInt(t.querySelector('.srvAantal').value) || 1 });
                });
            } else {
                document.querySelectorAll('.montage-task').forEach(t => {
                    let product = t.querySelector('.mntProduct').options[t.querySelector('.mntProduct').selectedIndex].text;
                    let ondergrond = t.querySelector('.mntOndergrond').options[t.querySelector('.mntOndergrond').selectedIndex].text;
                    let bediening = t.querySelector('.mntBediening').options[t.querySelector('.mntBediening').selectedIndex].text;
                    jsonBestellijst.push({ type: product, details: `${ondergrond} | ${bediening}`, aantal: parseInt(t.querySelector('.mntAantal').value) || 1 });
                });
            }

            let leesbareLijst = jsonBestellijst.map(item => `- ${item.aantal}x ${item.type} (${item.details})`).join('\n');

            let extraTags = [];
            if (document.getElementById('reqHoogwerker').checked) extraTags.push("🏗️ HOOGWERKER");
            if (document.getElementById('reqSteiger').checked) extraTags.push("🪜 STEIGER");
            if (document.getElementById('reqExtraMan').checked) extraTags.push("💪 EXTRA MONTEUR");
            
            const ladderSelect = document.getElementById('langeLadder').value;
            if (ladderSelect !== "Geen") extraTags.push(`⚠️ LANGE LADDER (${ladderSelect})`);

            let baseOpmerking = AppState.isServiceMode ? document.getElementById('klachtService').value : document.getElementById('opmerkingenMontage').value;
            let finalOpmerking = extraTags.length > 0 ? "⚠️ VEREISTEN: " + extraTags.join(" | ") + "\n\n" + baseOpmerking : baseOpmerking;

            const payload = {
                ordernummer: document.getElementById('ordernummer').value.trim(),
                naam: document.getElementById('naam').value,
                telefoon: "'" + telefoon,
                postcode: postcode,
                huisnummer: huisnummer,
                straatEnWoonplaats: netAdres,
                afdelingSource: document.getElementById('afdelingSource').value,
                gewenste_datum: document.getElementById('gewensteDatum').value,
                tijd_voorkeur: document.getElementById('tijdVoorkeur').value,
                vaste_tijd: document.getElementById('vasteTijd').value,
                afwijkende_reistijd: document.getElementById('afwijkendeReistijd').value,
                spoed: document.getElementById('spoed').checked,
                demontage: document.getElementById('demontage').checked,
                bestellijst: (AppState.isServiceMode ? "SERVICE TAKEN:\n" : "MONTAGE PRODUCTEN:\n") + leesbareLijst,
                montagetijd_minuten: AppState.totalTime,
                opmerkingen: finalOpmerking
            };

            // Network Request
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), APP_CONFIG.FETCH_TIMEOUT_MS);

            try {
                // FIX: Veiligere fetch instellingen voor brede compatibiliteit
                const response = await fetch(APP_CONFIG.WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                const text = await response.text();

                if (text.includes("OK")) {
                    document.getElementById('orderForm').classList.add('hidden');
                    document.getElementById('successMsg').classList.remove('hidden');
                } else if (text.includes("Bestaat al")) {
                    alert("❌ Ordernummer bestaat al in de database! Controleer het nummer en probeer het opnieuw.");
                    resetSubmitButton(btn);
                } else {
                    alert("❌ Fout bij opslaan: " + text);
                    resetSubmitButton(btn);
                }
            } catch (err) {
                clearTimeout(timeoutId);
                if (err.name === 'AbortError') {
                    alert("❌ De server deed er te lang over om te reageren. Controleer in Google Sheets of de order is doorgekomen.");
                } else {
                    alert("❌ Netwerkfout of Serverfout. Controleer of de URL klopt en je internetverbinding werkt.");
                }
                resetSubmitButton(btn);
            }
        }

        function resetSubmitButton(btn) {
            AppState.isSubmitting = false;
            btn.innerHTML = "🚀 Order Opslaan & Inplannen";
            btn.disabled = false;
            btn.classList.replace("bg-gray-400", "bg-blue-600");
            btn.classList.replace("opacity-75", "hover:-translate-y-1");
        }
    </script>
