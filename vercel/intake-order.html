<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Order Intake | Sombre ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hidden { display: none !important; }
        .toggle-btn.active { background-color: #1a73e8; color: white; border-color: #1a73e8; }
        .toggle-btn { background-color: #fff; color: #4b5563; border-color: #d1d5db; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-2xl mx-auto mb-6 flex justify-between items-center mt-2">
        <div>
            <h1 class="text-3xl font-extrabold text-gray-800">Nieuwe Order</h1>
            <p class="text-gray-500">Sombre ERP Systeem</p>
        </div>
        <a href="magazijn.html" class="bg-gray-800 hover:bg-gray-900 text-white font-bold py-2 px-4 rounded-lg transition-colors text-sm shadow-md flex items-center">
            Magazijn App ➡️
        </a>
    </div>

    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-sm p-6 border border-gray-200 mb-10">
        <form id="orderForm" class="space-y-6">

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Type Order</label>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="btnMontage" onclick="setType('Montage')" class="toggle-btn active font-bold py-3 rounded-lg border shadow-sm transition-all">🏗️ Nieuwe Montage</button>
                    <button type="button" id="btnService" onclick="setType('Service')" class="toggle-btn font-bold py-3 rounded-lg border shadow-sm transition-all">🛠️ Service Notion</button>
                </div>
            </div>

            <div id="serviceBronSectie" class="hidden bg-blue-50 p-4 rounded-lg border border-blue-100">
                <label class="block text-sm font-bold text-gray-700 mb-1">Afdeling / Bron</label>
                <select id="afdelingSource" class="w-full bg-white border border-gray-300 rounded-lg p-3 text-sm focus:ring-blue-500 focus:border-blue-500">
                    <option value="Sombre">Sombre Zonwering</option>
                    <option value="Degalux Zakelijk">Degalux Zakelijk</option>
                    <option value="Degalux Online">Degalux Online</option>
                </select>
            </div>

            <hr class="border-gray-200">

            <div>
                <h3 class="text-lg font-bold text-gray-800 mb-3">👤 Klant & Locatie</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Naam Klant *</label>
                        <input type="text" id="naam" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Telefoonnummer *</label>
                        <input type="tel" id="telefoon" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Postcode *</label>
                        <input type="text" id="postcode" required placeholder="Bijv. 1312 AB" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500 uppercase">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Huisnummer *</label>
                        <input type="text" id="huisnummer" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-gray-700 mb-1">Straat & Woonplaats *</label>
                        <input type="text" id="straatEnWoonplaats" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500">
                    </div>
                </div>
            </div>

            <hr class="border-gray-200">

            <div id="montageSectie">
                <h3 class="text-lg font-bold text-gray-800 mb-3">📦 Orderdetails</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Ordernummer *</label>
                        <input type="text" id="ordernummerMontage" placeholder="Bijv. SO-2026-01" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Geschatte Montagetijd (min) *</label>
                        <input type="number" id="montagetijdMontage" placeholder="Bijv. 120" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-gray-700 mb-1">Bestellijst / Producten *</label>
                        <textarea id="bestellijstMontage" rows="2" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500"></textarea>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-gray-700 mb-1">Opmerkingen (Optioneel)</label>
                        <textarea id="opmerkingenMontage" rows="2" placeholder="Specifieke instructies voor de monteurs..." class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500"></textarea>
                    </div>
                </div>
            </div>

            <div id="serviceSectie" class="hidden bg-gray-50 p-4 rounded-lg border border-gray-200">
                <h3 class="text-lg font-bold text-gray-800 mb-3">🛠️ Service Calculator</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Notion Ordernummer *</label>
                        <input type="text" id="ordernummerService" placeholder="Bijv. 251931" class="w-full bg-white border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500">
                    </div>
                    
                    <div class="md:col-span-2 grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Type Klus</label>
                            <select id="srvType" onchange="calculateServiceTime()" class="w-full bg-white border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500">
                                <option value="motor">Motor Vervangen</option>
                                <option value="doek">Doek Vervangen</option>
                                <option value="lamellen">Lamellen Vervangen/Schuiven</option>
                                <option value="armen">Armen Vervangen</option>
                                <option value="inregelen">Inregelen (Hub/AB)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Product</label>
                            <select id="srvProduct" onchange="calculateServiceTime()" class="w-full bg-white border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500">
                                <option value="screen_rolluik">Screen / Rolluik</option>
                                <option value="zonnescherm">Zonnescherm</option>
                                <option value="nvt">N.v.t. / Overig</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Aandrijving</label>
                            <select id="srvVoeding" onchange="calculateServiceTime()" class="w-full bg-white border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500">
                                <option value="solar">Solar</option>
                                <option value="stroom">Stroom (230V)</option>
                                <option value="hand">Handbediend (Band/Koord)</option>
                                <option value="nvt">N.v.t.</option>
                            </select>
                        </div>
                    </div>

                    <div class="md:col-span-2 bg-blue-100 border border-blue-200 rounded-lg p-3 flex justify-between items-center">
                        <span class="text-sm font-bold text-blue-900">Berekende Servicetijd:</span>
                        <span id="displayServiceTijd" class="text-lg font-extrabold text-blue-900">30 min</span>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-gray-700 mb-1">Klachtomschrijving / Onderdelen *</label>
                        <textarea id="klachtService" rows="2" placeholder="Wat is er defect? Welke onderdelen zijn verstuurd?" class="w-full bg-white border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500"></textarea>
                    </div>
                </div>
            </div>

            <hr class="border-gray-200">

            <div>
                <h3 class="text-lg font-bold text-gray-800 mb-3">📅 Planning & Voorkeuren</h3>
                
                <div class="flex items-center mb-4 bg-red-50 p-3 rounded-lg border border-red-100">
                    <input id="spoed" type="checkbox" class="w-5 h-5 text-red-600 bg-white border-gray-300 rounded focus:ring-red-500 focus:ring-2">
                    <label for="spoed" class="ml-2 text-sm font-bold text-red-800 flex items-center">
                        🔥 Dit is een SPOED opdracht
                    </label>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Gewenste Datum (Optioneel)</label>
                        <input type="date" id="gewensteDatum" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">Tijd Voorkeur (Optioneel)</label>
                        <select id="tijdVoorkeur" onchange="toggleVasteTijd()" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500">
                            <option value="Geen">Geen specifieke voorkeur</option>
                            <option value="Ochtend">Ochtend</option>
                            <option value="Middag">Middag</option>
                            <option value="Vast">Vaste tijd</option>
                        </select>
                    </div>
                    <div id="vasteTijdContainer" class="hidden md:col-span-2">
                        <label class="block text-xs font-bold text-gray-700 mb-1">Specifieke Tijd *</label>
                        <input type="time" id="vasteTijd" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-blue-500">
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full text-white bg-blue-600 hover:bg-blue-700 font-bold rounded-lg text-lg px-5 py-4 shadow-md transition-all">
                🚀 Opslaan & Inplannen
            </button>
        </form>

        <div id="successMsg" class="hidden mt-6 bg-green-100 border border-green-400 text-green-700 px-4 py-5 rounded-lg text-center font-bold shadow-sm">
            ✅ Order succesvol opgeslagen! De planningsmotor draait op de achtergrond.
            <button onclick="location.reload()" class="mt-4 block w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg transition-all">Nieuwe Order Invoeren</button>
        </div>
    </div>

<script>
    // VUL HIER JOUW NIEUWE GOOGLE APPS SCRIPT URL IN
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbztM02X2Jpd2uzt9sdN2zBbGSIarMgRPI-MvIe0OsvrxY98TZ0ogUbImtQ3ilmQPuM/exec";

    let isService = false;
    let berekendeServiceTijd = 30;

    function toggleVasteTijd() {
        const val = document.getElementById('tijdVoorkeur').value;
        if (val === 'Vast') {
            document.getElementById('vasteTijdContainer').classList.remove('hidden');
        } else {
            document.getElementById('vasteTijdContainer').classList.add('hidden');
            document.getElementById('vasteTijd').value = '';
        }
    }

    function setType(type) {
        isService = (type === 'Service');
        
        if(isService) {
            document.getElementById('btnService').classList.add('active');
            document.getElementById('btnMontage').classList.remove('active');
            document.getElementById('serviceSectie').classList.remove('hidden');
            document.getElementById('serviceBronSectie').classList.remove('hidden');
            document.getElementById('montageSectie').classList.add('hidden');
            
            document.getElementById('ordernummerService').required = true;
            document.getElementById('klachtService').required = true;
            document.getElementById('ordernummerMontage').required = false;
            document.getElementById('bestellijstMontage').required = false;
            document.getElementById('montagetijdMontage').required = false;
            
            calculateServiceTime();
        } else {
            document.getElementById('btnMontage').classList.add('active');
            document.getElementById('btnService').classList.remove('active');
            document.getElementById('montageSectie').classList.remove('hidden');
            document.getElementById('serviceSectie').classList.add('hidden');
            document.getElementById('serviceBronSectie').classList.add('hidden');
            
            document.getElementById('ordernummerMontage').required = true;
            document.getElementById('bestellijstMontage').required = true;
            document.getElementById('montagetijdMontage').required = true;
            document.getElementById('ordernummerService').required = false;
            document.getElementById('klachtService').required = false;
        }
    }

    function calculateServiceTime() {
        const type = document.getElementById('srvType').value;
        const prod = document.getElementById('srvProduct').value;
        const voeding = document.getElementById('srvVoeding').value;
        let t = 30;

        if (type === 'motor' && voeding === 'hand') {
            alert("⚠️ Let op: Een handbediend scherm heeft geen motor. We berekenen 60 minuten voor het vervangen van band/koord.");
        }

        if (type === 'motor') {
            if (voeding === 'hand') t = 60;
            else if (prod === 'zonnescherm') {
                t = (voeding === 'stroom') ? 60 : 45;
            } else {
                t = (voeding === 'stroom') ? 45 : 30;
            }
        } 
        else if (type === 'doek') {
            t = (prod === 'zonnescherm') ? 60 : 45;
        }
        else if (type === 'lamellen') t = 45;
        else if (type === 'armen') t = 60;
        else if (type === 'inregelen') t = 30;

        berekendeServiceTijd = t;
        document.getElementById('displayServiceTijd').innerText = t + " min";
    }

    document.getElementById('orderForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        // 1. DATA VALIDATIES
        const telefoon = document.getElementById('telefoon').value;
        if (!/^[0-9+\-\s]{8,20}$/.test(telefoon)) {
            alert("⚠️ Ongeldig telefoonnummer. Gebruik alleen cijfers, spaties, + of -.");
            return;
        }

        const postcode = document.getElementById('postcode').value;
        if (!/^[1-9][0-9]{3}\s?[A-Za-z]{2}$/i.test(postcode)) {
            alert("⚠️ Ongeldig postcode formaat. Gebruik 4 cijfers en 2 letters (bijv. 1312 AB).");
            return;
        }

        if (!isService) {
            const montagetijd = parseInt(document.getElementById('montagetijdMontage').value) || 0;
            if (montagetijd < 0) {
                alert("⚠️ Montagetijd mag niet negatief zijn.");
                return;
            }
        }

        if (document.getElementById('tijdVoorkeur').value === 'Vast' && !document.getElementById('vasteTijd').value) {
            alert("⚠️ Je hebt 'Vaste tijd' geselecteerd. Vul a.u.b. de specifieke tijd in.");
            return;
        }

        // 2. UI UPDATE (Als validatie slaagt)
        const btn = document.getElementById('submitBtn');
        btn.innerHTML = "⏳ Bezig met opslaan...";
        btn.disabled = true;
        btn.classList.replace("bg-blue-600", "bg-gray-400");

        let payload = {
            naam: document.getElementById('naam').value,
            telefoon: telefoon,
            postcode: postcode,
            huisnummer: document.getElementById('huisnummer').value,
            straatEnWoonplaats: document.getElementById('straatEnWoonplaats').value,
            gewenste_datum: document.getElementById('gewensteDatum').value,
            tijd_voorkeur: document.getElementById('tijdVoorkeur').value,
            vaste_tijd: document.getElementById('vasteTijd').value,
            spoed: document.getElementById('spoed').checked,
            isServiceNotion: isService
        };

        if (isService) {
            payload.ordernummer = document.getElementById('ordernummerService').value;
            payload.afdelingSource = document.getElementById('afdelingSource').value;
            
            const typeText = document.getElementById('srvType').options[document.getElementById('srvType').selectedIndex].text;
            const prodText = document.getElementById('srvProduct').options[document.getElementById('srvProduct').selectedIndex].text;
            const voedingText = document.getElementById('srvVoeding').options[document.getElementById('srvVoeding').selectedIndex].text;
            
            payload.bestellijst = `SERVICE: ${typeText} | ${prodText} | ${voedingText}`;
            payload.opmerkingen = document.getElementById('klachtService').value;
            payload.montagetijd_minuten = berekendeServiceTijd;
            payload.demontage = false;
        } else {
            payload.ordernummer = document.getElementById('ordernummerMontage').value;
            payload.afdelingSource = "Sombre";
            payload.bestellijst = document.getElementById('bestellijstMontage').value;
            payload.opmerkingen = document.getElementById('opmerkingenMontage').value;
            payload.montagetijd_minuten = parseInt(document.getElementById('montagetijdMontage').value) || 0;
            payload.demontage = false; 
        }

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000);

        try {
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify(payload),
                signal: controller.signal
            });
            clearTimeout(timeoutId);

            const text = await response.text();
            
            if(text === "OK") {
                document.getElementById('orderForm').classList.add('hidden');
                document.getElementById('successMsg').classList.remove('hidden');
            } else {
                alert("Fout bij opslaan: " + text);
                btn.innerHTML = "🚀 Opslaan & Inplannen";
                btn.disabled = false;
                btn.classList.replace("bg-gray-400", "bg-blue-600");
            }
        } catch(err) {
            clearTimeout(timeoutId);
            if (err.name === 'AbortError') {
                alert("❌ Server reageert niet (Timeout). Controleer in het planbord of hij toevallig is doorgekomen, of probeer het zo opnieuw.");
            } else {
                alert("❌ Netwerkfout. Controleer je internetverbinding.");
            }
            btn.innerHTML = "🚀 Opslaan & Inplannen";
            btn.disabled = false;
            btn.classList.replace("bg-gray-400", "bg-blue-600");
        }
    });

    setType('Montage');
</script>

</body>
</html>
